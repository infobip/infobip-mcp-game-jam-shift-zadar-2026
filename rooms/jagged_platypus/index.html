<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bubble Pop!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            width: 100vw;
            position: fixed;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
        }

        #timer {
            font-size: 24px;
            font-weight: bold;
        }

        #combo-display {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.5);
            animation: combo-pulse 0.3s ease-out;
            pointer-events: none;
            z-index: 150;
        }

        @keyframes combo-pulse {
            0% {
                transform: translateX(-50%) scale(0.8);
                opacity: 0;
            }
            50% {
                transform: translateX(-50%) scale(1.2);
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3),
                        inset 0 -10px 20px rgba(0, 0, 0, 0.2),
                        inset 0 10px 20px rgba(255, 255, 255, 0.5);
            animation: bubble-appear 0.3s ease-out, bubble-float 3s ease-in-out infinite;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes bubble-appear {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes bubble-float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-15px) scale(1.05);
            }
        }

        @keyframes bubble-pop {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .bubble.popping {
            animation: bubble-pop 0.3s ease-out forwards;
        }

        .score-popup {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            animation: score-float 1s ease-out forwards;
            z-index: 200;
        }

        @keyframes score-float {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-60px) scale(1.3);
                opacity: 0;
            }
        }

        #start-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
        }

        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 18px 48px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
        }

        button:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #e083eb 0%, #e5475c 100%);
        }

        #final-score {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
            color: #ffd700;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header" class="hidden">
            <div id="score">Score: 0</div>
            <div id="timer">Time: 30</div>
        </div>

        <div id="start-screen">
            <h1>🫧 Bubble Pop!</h1>
            <p>Tap the bubbles as fast as you can!<br>Build combos for bonus points!<br>You have 30 seconds to get the highest score!</p>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="end-screen" class="hidden">
            <h1>Game Over!</h1>
            <div id="final-score">0</div>
            <p>Great job popping bubbles!</p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const header = document.getElementById('header');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let gameInterval;
        let bubbleInterval;
        let combo = 0;
        let comboMultiplier = 1;
        let comboTimeout = null;
        let comboDisplay = null;

        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7', '#a29bfe'];

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function updateComboDisplay() {
            if (comboDisplay) {
                comboDisplay.remove();
            }

            if (combo >= 2) {
                comboDisplay = document.createElement('div');
                comboDisplay.id = 'combo-display';
                comboDisplay.textContent = `${combo}x COMBO! 🔥`;
                gameContainer.appendChild(comboDisplay);
            }
        }

        function resetCombo() {
            combo = 0;
            comboMultiplier = 1;
            if (comboDisplay) {
                comboDisplay.remove();
                comboDisplay = null;
            }
        }

        function showScorePopup(x, y, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = '+' + points;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            gameContainer.appendChild(popup);

            setTimeout(() => popup.remove(), 1000);
        }

        function handleBubblePop(bubble, basePoints, size) {
            if (!gameActive || bubble.classList.contains('popping')) return;

            bubble.classList.add('popping');

            // Update combo
            combo++;
            comboMultiplier = Math.min(Math.floor(combo / 3) + 1, 5); // Max 5x multiplier

            const finalPoints = basePoints * comboMultiplier;
            score += finalPoints;
            scoreEl.textContent = 'Score: ' + score;

            // Show score popup
            const bubbleRect = bubble.getBoundingClientRect();
            showScorePopup(bubbleRect.left + size / 2 - 20, bubbleRect.top, finalPoints);

            // Update combo display
            updateComboDisplay();

            // Reset combo timeout
            clearTimeout(comboTimeout);
            comboTimeout = setTimeout(resetCombo, 1500); // 1.5 seconds to keep combo

            setTimeout(() => {
                if (bubble.parentNode) {
                    bubble.remove();
                }
            }, 300);
        }

        function createBubble() {
            if (!gameActive) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const size = Math.random() * 40 + 60; // 60-100px
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.backgroundColor = getRandomColor();

            const maxX = window.innerWidth - size - 20;
            const maxY = window.innerHeight - size - 100;
            const x = Math.random() * maxX + 10;
            const y = Math.random() * (maxY - 100) + 100;

            bubble.style.left = x + 'px';
            bubble.style.top = y + 'px';

            const basePoints = Math.floor(110 - size);
            bubble.textContent = basePoints;

            gameContainer.appendChild(bubble);

            const lifetime = Math.random() * 1000 + 2000; // 2-3 seconds
            const removeTimer = setTimeout(() => {
                if (bubble.parentNode && !bubble.classList.contains('popping')) {
                    bubble.remove();
                }
            }, lifetime);

            // Use touchstart for better mobile support
            bubble.addEventListener('touchstart', (e) => {
                e.preventDefault();
                clearTimeout(removeTimer);
                handleBubblePop(bubble, basePoints, size);
            }, { passive: false });

            // Also support mouse clicks for desktop
            bubble.addEventListener('click', (e) => {
                e.preventDefault();
                clearTimeout(removeTimer);
                handleBubblePop(bubble, basePoints, size);
            });
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            combo = 0;
            comboMultiplier = 1;

            scoreEl.textContent = 'Score: 0';
            timerEl.textContent = 'Time: 30';

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            header.classList.remove('hidden');

            // Clear any existing bubbles and displays
            document.querySelectorAll('.bubble').forEach(b => b.remove());
            document.querySelectorAll('.score-popup').forEach(p => p.remove());
            resetCombo();

            // Create bubbles at intervals
            bubbleInterval = setInterval(createBubble, 800);

            // Start countdown
            gameInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = 'Time: ' + timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearInterval(bubbleInterval);
            clearTimeout(comboTimeout);

            // Remove all bubbles and displays
            document.querySelectorAll('.bubble').forEach(b => b.remove());
            document.querySelectorAll('.score-popup').forEach(p => p.remove());
            resetCombo();

            finalScoreEl.textContent = score;
            header.classList.add('hidden');
            endScreen.classList.remove('hidden');
        }

        // Button event handlers with multiple event types for compatibility
        function handleStartGame(e) {
            e.preventDefault();
            startGame();
        }

        startBtn.addEventListener('touchstart', handleStartGame, { passive: false });
        startBtn.addEventListener('click', handleStartGame);

        restartBtn.addEventListener('touchstart', handleStartGame, { passive: false });
        restartBtn.addEventListener('click', handleStartGame);

        // Prevent page scrolling and zooming
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.bubble') || gameActive) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
