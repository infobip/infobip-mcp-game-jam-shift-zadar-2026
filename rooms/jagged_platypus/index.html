<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bubble Pop!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
        }

        #timer {
            font-size: 24px;
            font-weight: bold;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3),
                        inset 0 -10px 20px rgba(0, 0, 0, 0.2),
                        inset 0 10px 20px rgba(255, 255, 255, 0.5);
            animation: bubble-appear 0.3s ease-out, bubble-float 3s ease-in-out infinite;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes bubble-appear {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes bubble-float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-15px) scale(1.05);
            }
        }

        @keyframes bubble-pop {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .bubble.popping {
            animation: bubble-pop 0.3s ease-out forwards;
        }

        #start-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
        }

        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 18px 48px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
        }

        button:active {
            transform: scale(0.95);
        }

        #final-score {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
            color: #ffd700;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header" class="hidden">
            <div id="score">Score: 0</div>
            <div id="timer">Time: 30</div>
        </div>

        <div id="start-screen">
            <h1>🫧 Bubble Pop!</h1>
            <p>Tap the bubbles as fast as you can!<br>You have 30 seconds to get the highest score!</p>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="end-screen" class="hidden">
            <h1>Game Over!</h1>
            <div id="final-score">0</div>
            <p>Great job popping bubbles!</p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const header = document.getElementById('header');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let gameInterval;
        let bubbleInterval;

        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7', '#a29bfe'];

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createBubble() {
            if (!gameActive) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const size = Math.random() * 40 + 60; // 60-100px
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.backgroundColor = getRandomColor();

            const maxX = window.innerWidth - size - 20;
            const maxY = window.innerHeight - size - 100;
            const x = Math.random() * maxX + 10;
            const y = Math.random() * (maxY - 100) + 100;

            bubble.style.left = x + 'px';
            bubble.style.top = y + 'px';

            const points = Math.floor(110 - size);
            bubble.textContent = points;

            gameContainer.appendChild(bubble);

            const lifetime = Math.random() * 1000 + 2000; // 2-3 seconds
            const removeTimer = setTimeout(() => {
                if (bubble.parentNode && !bubble.classList.contains('popping')) {
                    bubble.remove();
                }
            }, lifetime);

            bubble.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (gameActive && !bubble.classList.contains('popping')) {
                    bubble.classList.add('popping');
                    score += points;
                    scoreEl.textContent = 'Score: ' + score;
                    clearTimeout(removeTimer);
                    setTimeout(() => bubble.remove(), 300);
                }
            });
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;

            scoreEl.textContent = 'Score: 0';
            timerEl.textContent = 'Time: 30';

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            header.classList.remove('hidden');

            // Clear any existing bubbles
            document.querySelectorAll('.bubble').forEach(b => b.remove());

            // Create bubbles at intervals
            bubbleInterval = setInterval(createBubble, 800);

            // Start countdown
            gameInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = 'Time: ' + timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearInterval(bubbleInterval);

            // Remove all bubbles
            document.querySelectorAll('.bubble').forEach(b => b.remove());

            finalScoreEl.textContent = score;
            header.classList.add('hidden');
            endScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        // Prevent default touch behaviors
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
