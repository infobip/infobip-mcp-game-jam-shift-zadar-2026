<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sky Dash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            width: 100vw;
            height: 100svh;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #startScreen.hide {
            display: none;
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 3px solid white;
            padding: 20px 50px;
            font-size: 32px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 250px;
            min-height: 80px;
            margin: 20px;
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        #gameOver.show {
            display: flex;
        }

        #finalScore {
            font-size: 48px;
            margin: 20px 0;
        }

        #restartBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 3px solid white;
            padding: 16px 40px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
            margin: 10px;
        }

        #restartBtn:active {
            transform: scale(0.95);
        }

        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .instructions {
            color: white;
            font-size: 20px;
            text-align: center;
            margin: 20px;
        }

        #colorSelector {
            display: flex;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }

        .colorOption {
            width: 90px;
            height: 90px;
            border-radius: 15px;
            border: 4px solid rgba(255,255,255,0.5);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            position: relative;
        }

        .colorOption canvas {
            width: 100%;
            height: 100%;
        }

        .colorOption:active {
            transform: scale(0.9);
        }

        .colorOption.selected {
            border-color: #FFD700;
            border-width: 5px;
            box-shadow: 0 0 25px rgba(255,215,0,0.9);
        }

        .colorLabel {
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">Score: <span id="score">0</span></div>

    <div id="startScreen">
        <h1>✈️ Sky Dash</h1>
        <div class="instructions">
            Tap to fly!<br>
            Dodge the towers!
        </div>
        <div class="colorLabel">Choose Your Plane Color:</div>
        <div id="colorSelector"></div>
        <button id="startBtn">START</button>
    </div>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <div id="finalScore"></div>
        <button id="restartBtn">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameOverScreen = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const colorSelector = document.getElementById('colorSelector');

        let width, height;
        let gameRunning = false;
        let score = 0;
        let plane = {};
        let towers = [];
        let gravity = 0.6;
        let jump = -12;
        let towerSpeed = 3;
        let frameCount = 0;
        let selectedColor = 'classic';

        const colorSchemes = {
            classic: { body: '#E8E8E8', dark: '#D0D0D0', stripe1: '#4A90E2', stripe2: '#E85555' },
            blue: { body: '#4A90E2', dark: '#2E5C8A', stripe1: '#FFFFFF', stripe2: '#FFD700' },
            red: { body: '#E74C3C', dark: '#C0392B', stripe1: '#FFFFFF', stripe2: '#2C3E50' },
            green: { body: '#27AE60', dark: '#1E8449', stripe1: '#FFFFFF', stripe2: '#F39C12' },
            gold: { body: '#F39C12', dark: '#D68910', stripe1: '#2C3E50', stripe2: '#E74C3C' },
            purple: { body: '#9B59B6', dark: '#7D3C98', stripe1: '#FFFFFF', stripe2: '#F1C40F' }
        };

        function drawMiniPlane(ctx, colors) {
            const w = 60;
            const h = 35;
            const cx = 45;
            const cy = 45;

            ctx.clearRect(0, 0, 90, 90);
            ctx.save();
            ctx.translate(cx, cy);

            ctx.fillStyle = colors.body;
            ctx.fillRect(-w/2, -h/2 + 6, w * 0.85, h - 12);

            ctx.fillStyle = colors.body;
            ctx.beginPath();
            ctx.ellipse(-w/2 + 10, 0, 10, h/2 - 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = colors.dark;
            ctx.fillRect(-w/2 + 4, -h/2 + 3, 20, h/2 - 2);

            ctx.fillStyle = colors.stripe1;
            ctx.fillRect(-w/2 + 6, h/4 - 1, w * 0.6, 2.5);

            ctx.fillStyle = colors.stripe2;
            ctx.fillRect(-w/2 + 6, h/4 + 2, w * 0.6, 1.5);

            ctx.fillStyle = colors.dark;
            ctx.fillRect(w/2 - 6, -h/2 + 6, 6, h - 12);

            for (let i = 0; i < 6; i++) {
                ctx.fillStyle = '#8BCDEB';
                ctx.fillRect(-w/2 + 12 + i * 6, -h/2 + 9, 3, 4);
            }

            ctx.fillStyle = '#C8C8C8';
            ctx.beginPath();
            ctx.moveTo(-w/2 + 8, -h/2 - 1);
            ctx.lineTo(w/4, -h/2 - 1);
            ctx.lineTo(w/4 + 4, h/2 - 8);
            ctx.lineTo(-w/2 + 8, h/2 - 8);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#BFBFBF';
            ctx.beginPath();
            ctx.moveTo(-w/2 + 8, h/2 + 1);
            ctx.lineTo(w/4, h/2 + 1);
            ctx.lineTo(w/4 + 4, h/2 + 8);
            ctx.lineTo(-w/2 + 8, h/2 + 8);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#A0A0A0';
            ctx.beginPath();
            ctx.moveTo(w/2 - 14, -h/2);
            ctx.lineTo(w/2 - 4, -h/2);
            ctx.lineTo(w/2 - 6, -h/2 - 10);
            ctx.lineTo(w/2 - 12, -h/2 - 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function createColorOptions() {
            Object.keys(colorSchemes).forEach((colorKey, index) => {
                const option = document.createElement('div');
                option.className = 'colorOption';
                if (index === 0) option.classList.add('selected');
                option.dataset.color = colorKey;

                const miniCanvas = document.createElement('canvas');
                miniCanvas.width = 90;
                miniCanvas.height = 90;
                const miniCtx = miniCanvas.getContext('2d');

                drawMiniPlane(miniCtx, colorSchemes[colorKey]);

                option.appendChild(miniCanvas);
                colorSelector.appendChild(option);

                option.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.colorOption').forEach(opt =>
                        opt.classList.remove('selected')
                    );
                    option.classList.add('selected');
                    selectedColor = colorKey;
                });
            });
        }

        createColorOptions();

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function initGame() {
            plane = {
                x: width * 0.2,
                y: height / 2,
                width: 80,
                height: 45,
                velocity: 0
            };
            towers = [];
            score = 0;
            frameCount = 0;
            scoreEl.textContent = score;
        }

        function drawPlane() {
            ctx.save();
            ctx.translate(plane.x + plane.width / 2, plane.y + plane.height / 2);

            const angle = Math.min(Math.max(plane.velocity * 0.05, -0.5), 0.5);
            ctx.rotate(angle);

            const w = plane.width;
            const h = plane.height;
            const colors = colorSchemes[selectedColor];

            ctx.fillStyle = colors.body;
            ctx.fillRect(-w/2, -h/2 + 8, w * 0.85, h - 16);

            ctx.fillStyle = colors.body;
            ctx.beginPath();
            ctx.ellipse(-w/2 + 12, 0, 12, h/2 - 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = colors.dark;
            ctx.fillRect(-w/2 + 5, -h/2 + 4, 25, h/2 - 2);

            ctx.fillStyle = colors.stripe1;
            ctx.fillRect(-w/2 + 8, h/4 - 2, w * 0.6, 3);

            ctx.fillStyle = colors.stripe2;
            ctx.fillRect(-w/2 + 8, h/4 + 3, w * 0.6, 2);

            ctx.fillStyle = colors.dark;
            ctx.fillRect(w/2 - 8, -h/2 + 8, 8, h - 16);

            for (let i = 0; i < 8; i++) {
                ctx.fillStyle = '#8BCDEB';
                ctx.fillRect(-w/2 + 15 + i * 8, -h/2 + 12, 4, 6);
            }

            ctx.fillStyle = '#C8C8C8';
            ctx.beginPath();
            ctx.moveTo(-w/2 + 10, -h/2 - 2);
            ctx.lineTo(w/4, -h/2 - 2);
            ctx.lineTo(w/4 + 5, h/2 - 10);
            ctx.lineTo(-w/2 + 10, h/2 - 10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#BFBFBF';
            ctx.beginPath();
            ctx.moveTo(-w/2 + 10, h/2 + 2);
            ctx.lineTo(w/4, h/2 + 2);
            ctx.lineTo(w/4 + 5, h/2 + 10);
            ctx.lineTo(-w/2 + 10, h/2 + 10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#A0A0A0';
            ctx.beginPath();
            ctx.moveTo(w/2 - 18, -h/2);
            ctx.lineTo(w/2 - 5, -h/2);
            ctx.lineTo(w/2 - 8, -h/2 - 12);
            ctx.lineTo(w/2 - 15, -h/2 - 12);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawTower(tower) {
            ctx.fillStyle = '#555555';
            ctx.fillRect(tower.x, 0, tower.width, tower.topHeight);
            ctx.fillRect(tower.x, tower.topHeight + tower.gap, tower.width, height - tower.topHeight - tower.gap);

            ctx.fillStyle = '#666666';
            ctx.fillRect(tower.x, tower.topHeight - 20, tower.width, 20);
            ctx.fillRect(tower.x, tower.topHeight + tower.gap, tower.width, 20);

            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 2;
            for (let i = 0; i < tower.topHeight; i += 30) {
                ctx.beginPath();
                ctx.moveTo(tower.x, i);
                ctx.lineTo(tower.x + tower.width, i);
                ctx.stroke();
            }
            for (let i = tower.topHeight + tower.gap; i < height; i += 30) {
                ctx.beginPath();
                ctx.moveTo(tower.x, i);
                ctx.lineTo(tower.x + tower.width, i);
                ctx.stroke();
            }
        }

        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            const cloudY = (frameCount * 0.3) % (height + 100);
            ctx.beginPath();
            ctx.arc(width * 0.7, cloudY - 100, 40, 0, Math.PI * 2);
            ctx.arc(width * 0.75, cloudY - 100, 50, 0, Math.PI * 2);
            ctx.arc(width * 0.8, cloudY - 100, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(width * 0.2, (cloudY + 200) % height, 35, 0, Math.PI * 2);
            ctx.arc(width * 0.24, (cloudY + 200) % height, 45, 0, Math.PI * 2);
            ctx.arc(width * 0.28, (cloudY + 200) % height, 35, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateGame() {
            if (!gameRunning) return;

            frameCount++;

            plane.velocity += gravity;
            plane.y += plane.velocity;

            if (plane.y < 0) plane.y = 0;
            if (plane.y + plane.height > height) {
                endGame();
                return;
            }

            if (frameCount % 90 === 0) {
                const gap = 180;
                const minHeight = 50;
                const maxHeight = height - gap - 50;
                const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;

                towers.push({
                    x: width,
                    width: 70,
                    topHeight: topHeight,
                    gap: gap,
                    scored: false
                });
            }

            for (let i = towers.length - 1; i >= 0; i--) {
                towers[i].x -= towerSpeed;

                if (towers[i].x + towers[i].width < 0) {
                    towers.splice(i, 1);
                    continue;
                }

                if (!towers[i].scored && towers[i].x + towers[i].width < plane.x) {
                    towers[i].scored = true;
                    score++;
                    scoreEl.textContent = score;
                }

                if (
                    plane.x < towers[i].x + towers[i].width &&
                    plane.x + plane.width > towers[i].x &&
                    (plane.y < towers[i].topHeight ||
                     plane.y + plane.height > towers[i].topHeight + towers[i].gap)
                ) {
                    endGame();
                    return;
                }
            }
        }

        function drawGame() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, width, height);

            drawClouds();

            towers.forEach(drawTower);
            drawPlane();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function flap() {
            if (gameRunning) {
                plane.velocity = jump;
            }
        }

        function startGame() {
            initGame();
            gameRunning = true;
            startScreen.classList.add('hide');
            gameOverScreen.classList.remove('show');
        }

        function endGame() {
            gameRunning = false;
            finalScoreEl.textContent = score + ' towers!';
            gameOverScreen.classList.add('show');
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            flap();
        });

        startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        initGame();
        gameLoop();
    </script>
</body>
</html>
