<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Color Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100svh;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            color: white;
        }

        #header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 18px;
        }

        #target {
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }

        #targetColor {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid white;
            vertical-align: middle;
            margin-left: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #gameArea {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .circle:active {
            transform: scale(0.9);
        }

        #timeBar {
            height: 8px;
            background: rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }

        #timeProgress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            width: 100%;
            transition: width 0.1s linear;
        }

        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #gameOver.show {
            display: flex;
        }

        #finalScore {
            font-size: 48px;
            margin: 20px 0;
        }

        #restartBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 3px solid white;
            padding: 16px 40px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
            margin: 10px;
        }

        #restartBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🎯 Color Rush</h1>
        <div id="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Level: <span id="level">1</span></div>
        </div>
    </div>

    <div id="target">
        Tap: <div id="targetColor"></div>
    </div>

    <div id="gameArea"></div>

    <div id="timeBar">
        <div id="timeProgress"></div>
    </div>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <div id="finalScore"></div>
        <button id="restartBtn">Play Again</button>
    </div>

    <script>
        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
            '#FF85A2', '#7FE5D8', '#FFD93D', '#6BCF7F'
        ];

        let score = 0;
        let level = 1;
        let targetColor = '';
        let timeLeft = 100;
        let gameInterval;
        let spawnInterval;
        let circles = [];

        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const targetColorEl = document.getElementById('targetColor');
        const timeProgress = document.getElementById('timeProgress');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        function startGame() {
            score = 0;
            level = 1;
            timeLeft = 100;
            circles = [];
            gameArea.innerHTML = '';
            gameOverEl.classList.remove('show');
            updateUI();
            pickNewTarget();

            gameInterval = setInterval(() => {
                timeLeft -= 0.5;
                timeProgress.style.width = timeLeft + '%';

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 50);

            spawnInterval = setInterval(spawnCircle, 800);
        }

        function pickNewTarget() {
            targetColor = colors[Math.floor(Math.random() * colors.length)];
            targetColorEl.style.backgroundColor = targetColor;
        }

        function spawnCircle() {
            const circle = document.createElement('div');
            circle.className = 'circle';

            const size = 50 + Math.random() * 30;
            const isTarget = Math.random() < 0.4;
            const color = isTarget ? targetColor : colors[Math.floor(Math.random() * colors.length)];

            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.style.backgroundColor = color;
            circle.style.left = Math.random() * (gameArea.offsetWidth - size) + 'px';
            circle.style.top = Math.random() * (gameArea.offsetHeight - size) + 'px';
            circle.dataset.isTarget = isTarget;

            circle.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleCircleClick(circle, isTarget);
            });

            gameArea.appendChild(circle);
            circles.push(circle);

            setTimeout(() => {
                if (circle.parentNode) {
                    circle.remove();
                    circles = circles.filter(c => c !== circle);
                }
            }, 3000);

            if (circles.length > 15) {
                const oldest = circles.shift();
                if (oldest.parentNode) {
                    oldest.remove();
                }
            }
        }

        function handleCircleClick(circle, isTarget) {
            if (isTarget) {
                score += 10 * level;
                timeLeft = Math.min(100, timeLeft + 5);
                circle.style.transform = 'scale(1.3)';
                circle.style.opacity = '0';

                if (score > 0 && score % 100 === 0) {
                    level++;
                    clearInterval(spawnInterval);
                    spawnInterval = setInterval(spawnCircle, Math.max(400, 800 - level * 50));
                }
            } else {
                timeLeft = Math.max(0, timeLeft - 10);
                circle.style.transform = 'scale(0.5)';
            }

            setTimeout(() => {
                if (circle.parentNode) {
                    circle.remove();
                }
                circles = circles.filter(c => c !== circle);
            }, 200);

            updateUI();
        }

        function updateUI() {
            scoreEl.textContent = score;
            levelEl.textContent = level;
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            finalScoreEl.textContent = score + ' points!';
            gameOverEl.classList.add('show');
        }

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        startGame();
    </script>
</body>
</html>
