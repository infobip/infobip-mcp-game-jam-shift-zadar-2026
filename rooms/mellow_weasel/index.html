<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Logarithmic Number Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            width: 100vw;
            height: 100svh;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .input-section {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #numberInput {
            width: 100%;
            padding: 20px;
            font-size: 28px;
            border: 4px solid white;
            border-radius: 15px;
            background: rgba(255,255,255,0.95);
            color: #1e3c72;
            font-weight: bold;
            text-align: center;
            touch-action: manipulation;
        }

        #numberInput:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .info {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
            text-align: center;
        }

        #display {
            background: rgba(0,0,0,0.7);
            border: 4px solid white;
            border-radius: 20px;
            padding: 25px;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        #digitDisplay {
            font-family: 'Courier New', monospace;
            font-size: 72px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            letter-spacing: 8px;
            margin-bottom: 15px;
            background: #000;
            padding: 20px;
            border-radius: 10px;
        }

        #scientificNotation {
            font-size: 18px;
            color: #90EE90;
            margin-top: 10px;
        }

        .thermometer-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scale-labels {
            position: absolute;
            left: -80px;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
        }

        .scale-label {
            text-align: right;
            width: 70px;
        }

        #thermometer {
            width: 60px;
            height: 450px;
            background: rgba(255,255,255,0.2);
            border: 4px solid white;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        #mercury {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #ff0000, #ff6600, #ffaa00);
            transition: height 0.5s ease-out;
            border-radius: 0 0 26px 26px;
            box-shadow: 0 0 20px rgba(255,100,0,0.6);
        }

        #currentMarker {
            position: absolute;
            left: -10px;
            right: -10px;
            height: 4px;
            background: white;
            box-shadow: 0 0 10px white;
            transition: bottom 0.5s ease-out;
        }

        .tick {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <h1>📊 Logarithmic Number Visualizer</h1>

    <div class="container">
        <div class="input-section">
            <label for="numberInput">Enter Number (1 - 5,000,000)</label>
            <input type="number" id="numberInput" min="1" max="5000000" value="1" placeholder="Enter number">
            <div class="info">Logarithmic scale visualization</div>
        </div>

        <div class="thermometer-container">
            <div class="scale-labels">
                <div class="scale-label">5M</div>
                <div class="scale-label">1M</div>
                <div class="scale-label">100K</div>
                <div class="scale-label">10K</div>
                <div class="scale-label">1K</div>
                <div class="scale-label">100</div>
                <div class="scale-label">10</div>
                <div class="scale-label">1</div>
            </div>
            <div id="thermometer">
                <div id="mercury"></div>
                <div id="currentMarker"></div>
            </div>
        </div>

        <div id="display">
            <div id="digitDisplay">000</div>
            <div id="scientificNotation">0.00e+0</div>
        </div>
    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const mercury = document.getElementById('mercury');
        const currentMarker = document.getElementById('currentMarker');
        const digitDisplay = document.getElementById('digitDisplay');
        const scientificNotation = document.getElementById('scientificNotation');

        const MIN_VALUE = 1;
        const MAX_VALUE = 5000000;

        function updateVisualization() {
            let value = parseInt(numberInput.value) || 1;

            if (value < MIN_VALUE) value = MIN_VALUE;
            if (value > MAX_VALUE) value = MAX_VALUE;

            numberInput.value = value;

            const minLog = Math.log10(MIN_VALUE);
            const maxLog = Math.log10(MAX_VALUE);
            const valueLog = Math.log10(value);

            const percentage = ((valueLog - minLog) / (maxLog - minLog)) * 100;

            mercury.style.height = percentage + '%';
            currentMarker.style.bottom = percentage + '%';

            if (value >= 1000) {
                const shortened = (value / 1000).toFixed(0);
                digitDisplay.textContent = shortened.padStart(3, '0');
            } else {
                digitDisplay.textContent = value.toString().padStart(3, '0');
            }

            const exponent = Math.floor(Math.log10(value));
            const mantissa = value / Math.pow(10, exponent);
            scientificNotation.textContent = `${mantissa.toFixed(2)}e+${exponent}`;

            const formattedNumber = value.toLocaleString();
            document.title = `${formattedNumber} - Log Visualizer`;
        }

        numberInput.addEventListener('input', updateVisualization);

        numberInput.addEventListener('focus', function() {
            this.select();
        });

        updateVisualization();
    </script>
</body>
</html>
