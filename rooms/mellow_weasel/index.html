<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Color Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100svh;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            color: white;
        }

        #header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 18px;
        }

        #trophyBtn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #trophyBtn:active {
            transform: scale(0.9);
        }

        #target {
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }

        #targetColor {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid white;
            vertical-align: middle;
            margin-left: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #gameArea {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .circle:active {
            transform: scale(0.9);
        }

        #timeBar {
            height: 8px;
            background: rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }

        #timeProgress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            width: 100%;
            transition: width 0.1s linear;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #startScreen.hide {
            display: none;
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 3px solid white;
            padding: 20px 50px;
            font-size: 32px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 250px;
            min-height: 80px;
            margin: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #gameOver.show {
            display: flex;
        }

        #finalScore {
            font-size: 48px;
            margin: 20px 0;
        }

        #restartBtn, #collectionBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 3px solid white;
            padding: 16px 40px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
            margin: 10px;
        }

        #restartBtn:active, #collectionBtn:active {
            transform: scale(0.95);
        }

        #comboDisplay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        #comboDisplay.show {
            animation: comboPopup 0.6s ease-out;
        }

        @keyframes comboPopup {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 0.8s ease-out forwards;
        }

        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        #rewardScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 1001;
            overflow-y: auto;
        }

        #rewardScreen.show {
            display: flex;
        }

        #closeRewardBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            touch-action: manipulation;
        }

        #closeRewardBtn:active {
            transform: scale(0.9);
        }

        .tshirt {
            width: 140px;
            height: 140px;
            margin: 15px;
            display: inline-block;
            position: relative;
        }

        .tshirt-body {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tshirt.locked .tshirt-body {
            background: rgba(100,100,100,0.3);
            border-color: rgba(255,255,255,0.3);
            filter: grayscale(1);
        }

        .tshirt-label {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
        }

        .new-unlock {
            animation: unlockPulse 1s ease-in-out;
        }

        @keyframes unlockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 30px rgba(255,255,255,0.8); }
        }

        #rewardGrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 60px;
        }

        .instructions {
            text-align: center;
            font-size: 18px;
            margin: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="header">
        <button id="trophyBtn">👕</button>
        <h1>🎯 Color Rush</h1>
        <div id="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Combo: <span id="combo">0</span>x</div>
            <div>Level: <span id="level">1</span></div>
        </div>
    </div>

    <div id="target">
        Tap: <div id="targetColor"></div>
    </div>

    <div id="gameArea">
        <div id="comboDisplay"></div>
    </div>

    <div id="timeBar">
        <div id="timeProgress"></div>
    </div>

    <div id="startScreen">
        <h2 style="font-size: 36px; margin-bottom: 20px;">🎯 Color Rush</h2>
        <div class="instructions">
            Tap circles that match<br>the target color!<br><br>
            Build combos for bonus points<br>
            Unlock t-shirts as you score!
        </div>
        <button id="startBtn">START GAME</button>
    </div>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <div id="finalScore"></div>
        <div id="newUnlockMsg"></div>
        <button id="restartBtn">Play Again</button>
        <button id="collectionBtn">View Collection</button>
    </div>

    <div id="rewardScreen">
        <button id="closeRewardBtn">✕</button>
        <h2 style="margin-top: 20px;">👕 T-Shirt Collection</h2>
        <p style="margin-top: 10px; opacity: 0.8;">Unlock shirts by reaching score milestones!</p>
        <div id="rewardGrid"></div>
    </div>

    <script>
        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
            '#FF85A2', '#7FE5D8', '#FFD93D', '#6BCF7F'
        ];

        const tshirts = [
            { emoji: '👕', name: 'Starter Tee', score: 0, color: '#ffffff' },
            { emoji: '👔', name: 'Pro Shirt', score: 50, color: '#4ECDC4' },
            { emoji: '🎽', name: 'Champion Tank', score: 150, color: '#FF6B6B' },
            { emoji: '🥼', name: 'Lab Coat', score: 300, color: '#F7DC6F' },
            { emoji: '🦺', name: 'Safety Vest', score: 500, color: '#FFA07A' },
            { emoji: '🎓', name: 'Graduate Cap', score: 750, color: '#BB8FCE' },
            { emoji: '👑', name: 'Royal Crown', score: 1000, color: '#FFD93D' },
            { emoji: '🏆', name: 'Legend Trophy', score: 1500, color: '#85C1E2' }
        ];

        let score = 0;
        let highScore = parseInt(localStorage.getItem('highScore') || '0');
        let level = 1;
        let combo = 0;
        let targetColor = '';
        let timeLeft = 100;
        let gameInterval;
        let spawnInterval;
        let circles = [];
        let unlockedShirts = new Set(JSON.parse(localStorage.getItem('unlockedShirts') || '["👕"]'));
        let newlyUnlocked = [];

        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const comboEl = document.getElementById('combo');
        const targetColorEl = document.getElementById('targetColor');
        const timeProgress = document.getElementById('timeProgress');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const collectionBtn = document.getElementById('collectionBtn');
        const comboDisplay = document.getElementById('comboDisplay');
        const trophyBtn = document.getElementById('trophyBtn');
        const rewardScreen = document.getElementById('rewardScreen');
        const closeRewardBtn = document.getElementById('closeRewardBtn');
        const newUnlockMsg = document.getElementById('newUnlockMsg');

        function startGame() {
            score = 0;
            level = 1;
            combo = 0;
            timeLeft = 100;
            circles = [];
            newlyUnlocked = [];
            gameArea.innerHTML = '<div id="comboDisplay"></div>';
            startScreen.classList.add('hide');
            gameOverEl.classList.remove('show');
            updateUI();
            pickNewTarget();

            gameInterval = setInterval(() => {
                timeLeft -= 0.5;
                timeProgress.style.width = timeLeft + '%';

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 50);

            spawnInterval = setInterval(spawnCircle, 800);
        }

        function pickNewTarget() {
            targetColor = colors[Math.floor(Math.random() * colors.length)];
            targetColorEl.style.backgroundColor = targetColor;
        }

        function spawnCircle() {
            const circle = document.createElement('div');
            circle.className = 'circle';

            const size = 50 + Math.random() * 30;
            const isTarget = Math.random() < 0.4;
            const color = isTarget ? targetColor : colors[Math.floor(Math.random() * colors.length)];

            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.style.backgroundColor = color;
            circle.style.left = Math.random() * (gameArea.offsetWidth - size) + 'px';
            circle.style.top = Math.random() * (gameArea.offsetHeight - size) + 'px';
            circle.dataset.isTarget = isTarget;

            circle.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleCircleClick(circle, isTarget, e.clientX, e.clientY);
            });

            gameArea.appendChild(circle);
            circles.push(circle);

            setTimeout(() => {
                if (circle.parentNode) {
                    circle.remove();
                    circles = circles.filter(c => c !== circle);
                }
            }, 3000);

            if (circles.length > 15) {
                const oldest = circles.shift();
                if (oldest.parentNode) {
                    oldest.remove();
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = color;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = (Math.PI * 2 * i) / 8;
                const distance = 50 + Math.random() * 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');

                gameArea.appendChild(particle);

                setTimeout(() => particle.remove(), 800);
            }
        }

        function showComboText(comboCount) {
            const display = document.getElementById('comboDisplay');
            if (!display) return;

            display.textContent = comboCount + 'x COMBO!';
            display.className = 'show';

            setTimeout(() => {
                display.className = '';
            }, 600);
        }

        function checkUnlocks() {
            tshirts.forEach(shirt => {
                if (score >= shirt.score && !unlockedShirts.has(shirt.emoji)) {
                    unlockedShirts.add(shirt.emoji);
                    newlyUnlocked.push(shirt);
                }
            });
            localStorage.setItem('unlockedShirts', JSON.stringify([...unlockedShirts]));
        }

        function handleCircleClick(circle, isTarget, x, y) {
            if (isTarget) {
                combo++;
                const points = 10 * level * combo;
                score += points;
                timeLeft = Math.min(100, timeLeft + 5);

                createParticles(x, y, targetColor);

                circle.style.transform = 'scale(1.3)';
                circle.style.opacity = '0';

                if (combo >= 3) {
                    showComboText(combo);
                }

                checkUnlocks();

                if (score > 0 && score % 100 === 0) {
                    level++;
                    clearInterval(spawnInterval);
                    spawnInterval = setInterval(spawnCircle, Math.max(400, 800 - level * 50));
                }
            } else {
                combo = 0;
                timeLeft = Math.max(0, timeLeft - 10);
                circle.style.transform = 'scale(0.5)';
            }

            setTimeout(() => {
                if (circle.parentNode) {
                    circle.remove();
                }
                circles = circles.filter(c => c !== circle);
            }, 200);

            updateUI();
        }

        function updateUI() {
            scoreEl.textContent = score;
            levelEl.textContent = level;
            comboEl.textContent = combo;
        }

        function renderCollection() {
            const grid = document.getElementById('rewardGrid');
            grid.innerHTML = '';

            tshirts.forEach(shirt => {
                const div = document.createElement('div');
                div.className = 'tshirt';
                if (!unlockedShirts.has(shirt.emoji)) {
                    div.classList.add('locked');
                }

                const body = document.createElement('div');
                body.className = 'tshirt-body';
                body.style.backgroundColor = shirt.color;
                body.textContent = unlockedShirts.has(shirt.emoji) ? shirt.emoji : '🔒';

                const label = document.createElement('div');
                label.className = 'tshirt-label';
                label.textContent = unlockedShirts.has(shirt.emoji) ? shirt.name : `Score ${shirt.score}`;

                div.appendChild(body);
                div.appendChild(label);
                grid.appendChild(div);
            });
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            finalScoreEl.textContent = score + ' points!';

            if (newlyUnlocked.length > 0) {
                newUnlockMsg.textContent = '🎉 New unlock: ' + newlyUnlocked[0].name + '!';
                newUnlockMsg.style.fontSize = '20px';
                newUnlockMsg.style.marginTop = '15px';
            } else {
                newUnlockMsg.textContent = '';
            }

            gameOverEl.classList.add('show');
        }

        startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        collectionBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            renderCollection();
            rewardScreen.classList.add('show');
            gameOverEl.classList.remove('show');
        });

        trophyBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            renderCollection();
            rewardScreen.classList.add('show');
        });

        closeRewardBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            rewardScreen.classList.remove('show');
        });
    </script>
</body>
</html>
