<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Dice Roller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        h1 {
            font-size: 48px;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .controls {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin: 20px 0;
        }

        label {
            display: block;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            min-width: 70px;
            padding: 15px;
            font-size: 18px;
            border: 3px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s;
            font-weight: bold;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn.selected {
            background: rgba(255,255,255,0.9);
            color: #667eea;
            border-color: white;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        #rollBtn {
            width: 100%;
            padding: 20px;
            font-size: 28px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #333;
            border: 4px solid white;
            border-radius: 20px;
            cursor: pointer;
            touch-action: manipulation;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            min-height: 70px;
        }

        #rollBtn:active {
            transform: scale(0.98);
        }

        #results {
            width: 100%;
            max-width: 600px;
            margin: 30px 0;
        }

        #diceContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .die {
            width: 80px;
            height: 80px;
            background: white;
            color: #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 3px solid #667eea;
        }

        .die.rolling {
            animation: roll 0.5s ease-in-out;
        }

        @keyframes roll {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
        }

        #totalDisplay {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #totalDisplay h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #totalValue {
            font-size: 64px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 18px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            opacity: 0.8;
            font-size: 14px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🎲 Dice Roller</h1>

    <div class="controls">
        <div class="control-group">
            <label>Number of Dice</label>
            <div class="button-group" id="numDiceButtons">
                <button class="option-btn selected" data-value="1">1</button>
                <button class="option-btn" data-value="2">2</button>
                <button class="option-btn" data-value="3">3</button>
                <button class="option-btn" data-value="4">4</button>
                <button class="option-btn" data-value="5">5</button>
                <button class="option-btn" data-value="6">6</button>
            </div>
        </div>

        <div class="control-group">
            <label>Dice Type (Faces)</label>
            <div class="button-group" id="facesButtons">
                <button class="option-btn" data-value="4">D4</button>
                <button class="option-btn selected" data-value="6">D6</button>
                <button class="option-btn" data-value="8">D8</button>
                <button class="option-btn" data-value="10">D10</button>
                <button class="option-btn" data-value="12">D12</button>
                <button class="option-btn" data-value="20">D20</button>
            </div>
        </div>

        <button id="rollBtn">🎲 ROLL DICE</button>
    </div>

    <div id="results">
        <div id="diceContainer"></div>
        <div id="totalDisplay" style="display: none;">
            <h2>Total</h2>
            <div id="totalValue">0</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Min</div>
                    <div class="stat-value" id="minValue">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Max</div>
                    <div class="stat-value" id="maxValue">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Avg</div>
                    <div class="stat-value" id="avgValue">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let numDice = 1;
        let numFaces = 6;

        const numDiceButtons = document.querySelectorAll('#numDiceButtons .option-btn');
        const facesButtons = document.querySelectorAll('#facesButtons .option-btn');
        const rollBtn = document.getElementById('rollBtn');
        const diceContainer = document.getElementById('diceContainer');
        const totalDisplay = document.getElementById('totalDisplay');
        const totalValue = document.getElementById('totalValue');
        const minValue = document.getElementById('minValue');
        const maxValue = document.getElementById('maxValue');
        const avgValue = document.getElementById('avgValue');

        numDiceButtons.forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                numDiceButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                numDice = parseInt(btn.dataset.value);
            });
        });

        facesButtons.forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                facesButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                numFaces = parseInt(btn.dataset.value);
            });
        });

        function rollDice() {
            diceContainer.innerHTML = '';
            const results = [];

            for (let i = 0; i < numDice; i++) {
                const die = document.createElement('div');
                die.className = 'die rolling';
                die.textContent = '?';
                diceContainer.appendChild(die);

                setTimeout(() => {
                    const value = Math.floor(Math.random() * numFaces) + 1;
                    results.push(value);
                    die.textContent = value;
                    die.classList.remove('rolling');

                    if (results.length === numDice) {
                        displayResults(results);
                    }
                }, 500);
            }
        }

        function displayResults(results) {
            const total = results.reduce((sum, val) => sum + val, 0);
            const min = Math.min(...results);
            const max = Math.max(...results);
            const avg = (total / results.length).toFixed(1);

            totalValue.textContent = total;
            minValue.textContent = min;
            maxValue.textContent = max;
            avgValue.textContent = avg;
            totalDisplay.style.display = 'block';
        }

        rollBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            rollDice();
        });
    </script>
</body>
</html>
