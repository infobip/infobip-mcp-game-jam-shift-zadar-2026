<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Coin Tapper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            max-width: 100%;
            height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: manipulation;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #stats {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #score {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #timer {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #coin-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f9d423 0%, #ff4e50 100%);
            border: 8px solid #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 -5px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            transition: transform 0.1s;
            user-select: none;
        }

        #coin:active {
            transform: scale(0.9);
        }

        #coin.tap-effect {
            animation: tap-pulse 0.3s ease-out;
        }

        @keyframes tap-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tap-particle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        #start-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 200;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #end-screen {
            display: none;
        }

        h1 {
            color: white;
            font-size: 38px;
            margin: 15px 0;
            text-align: center;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
        }

        .instruction {
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .start-btn {
            background: linear-gradient(145deg, #f9d423 0%, #ff4e50 100%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 220px;
            min-height: 65px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        #final-score {
            color: white;
            font-size: 38px;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
        }

        #taps-per-second {
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        #leaderboard {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            max-height: 300px;
            overflow-y: auto;
        }

        #leaderboard h2 {
            color: #19547b;
            font-size: 24px;
            margin-bottom: 12px;
            text-align: center;
            text-shadow: none;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: rgba(25, 84, 123, 0.1);
            border-radius: 8px;
            font-size: 16px;
        }

        .leaderboard-entry.current {
            background: linear-gradient(145deg, #f9d423 0%, #ff4e50 100%);
            color: white;
            font-weight: bold;
        }

        .leaderboard-rank {
            font-weight: bold;
            margin-right: 8px;
            color: #19547b;
            min-width: 35px;
        }

        .leaderboard-entry.current .leaderboard-rank {
            color: white;
        }

        .leaderboard-name {
            flex: 1;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-entry.current .leaderboard-name {
            color: white;
        }

        .leaderboard-score {
            font-weight: bold;
            color: #19547b;
            margin-left: 10px;
        }

        .leaderboard-entry.current .leaderboard-score {
            color: white;
        }

        #name-input-container {
            margin-bottom: 15px;
            text-align: center;
        }

        #name-input {
            font-size: 18px;
            padding: 10px 18px;
            border: 3px solid white;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #19547b;
            font-weight: bold;
            text-align: center;
            max-width: 250px;
            width: 100%;
        }

        #name-input::placeholder {
            color: rgba(25, 84, 123, 0.5);
        }

        .timer-warning {
            animation: pulse-red 0.5s ease-in-out infinite;
        }

        @keyframes pulse-red {
            0%, 100% { color: #fff; }
            50% { color: #ff4e50; }
        }

        #leaderboard-start {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            margin-top: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            max-height: 280px;
            overflow-y: auto;
        }

        #leaderboard-start h2 {
            color: #19547b;
            font-size: 22px;
            margin-bottom: 12px;
            text-align: center;
            text-shadow: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats">
            <div id="score">0</div>
            <div id="timer">25s</div>
        </div>

        <div id="coin-container">
            <div id="coin">🪙</div>
        </div>

        <div id="start-screen">
            <h1>🪙 Coin Tapper 🪙</h1>
            <p class="instruction">Tap the coin as fast as you can!<br><br>Each tap = 1 point<br>You have 25 seconds<br><br>How fast can you tap?</p>
            <button class="start-btn" id="start-button">Start Tapping!</button>
            <div id="leaderboard-start">
                <h2>🏆 Top Scores 🏆</h2>
                <div id="leaderboard-start-list"></div>
            </div>
        </div>

        <div id="end-screen">
            <h1>Time's Up!</h1>
            <div id="final-score">0 Taps</div>
            <div id="taps-per-second">0 taps/second</div>
            <div id="name-input-container">
                <input type="text" id="name-input" placeholder="Enter your name" maxlength="15">
            </div>
            <div id="leaderboard">
                <h2>🏆 Leaderboard 🏆</h2>
                <div id="leaderboard-list"></div>
            </div>
            <button class="start-btn" id="restart-button">Tap Again!</button>
        </div>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const finalScoreDisplay = document.getElementById('final-score');
        const tapsPerSecondDisplay = document.getElementById('taps-per-second');
        const coinContainer = document.getElementById('coin-container');
        const nameInput = document.getElementById('name-input');
        const leaderboardList = document.getElementById('leaderboard-list');
        const leaderboardStartList = document.getElementById('leaderboard-start-list');

        let score = 0;
        let gameActive = false;
        let timeLeft = 25;
        let timerInterval;
        let currentGameId = Date.now();

        function getLeaderboard() {
            const stored = localStorage.getItem('coinTapperLeaderboard');
            return stored ? JSON.parse(stored) : [];
        }

        function saveLeaderboard(leaderboard) {
            localStorage.setItem('coinTapperLeaderboard', JSON.stringify(leaderboard));
        }

        function addScore(name, score) {
            const leaderboard = getLeaderboard();
            currentGameId = Date.now();
            leaderboard.push({ name, score, id: currentGameId });
            leaderboard.sort((a, b) => b.score - a.score);
            const topScores = leaderboard.slice(0, 10);
            saveLeaderboard(topScores);
            return topScores;
        }

        function displayLeaderboard(container, highlightId = null) {
            const leaderboard = getLeaderboard();
            container.innerHTML = '';

            if (leaderboard.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 10px;">No scores yet!</div>';
                return;
            }

            leaderboard.forEach((entry, index) => {
                const div = document.createElement('div');
                div.className = 'leaderboard-entry';
                if (entry.id === highlightId) {
                    div.classList.add('current');
                }

                const rank = document.createElement('span');
                rank.className = 'leaderboard-rank';
                rank.textContent = `#${index + 1}`;

                const name = document.createElement('span');
                name.className = 'leaderboard-name';
                name.textContent = entry.name;

                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'leaderboard-score';
                scoreSpan.textContent = entry.score;

                div.appendChild(rank);
                div.appendChild(name);
                div.appendChild(scoreSpan);
                container.appendChild(div);
            });
        }

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'tap-particle';
            particle.textContent = '+1';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            coinContainer.appendChild(particle);

            setTimeout(() => particle.remove(), 1000);
        }

        function handleTap(e) {
            if (!gameActive) return;

            e.preventDefault();

            score++;
            scoreDisplay.textContent = score;

            coin.classList.remove('tap-effect');
            void coin.offsetWidth;
            coin.classList.add('tap-effect');

            const rect = coinContainer.getBoundingClientRect();
            const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - rect.left;
            const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - rect.top;
            createParticle(x, y);
        }

        coin.addEventListener('pointerdown', handleTap);
        coin.addEventListener('touchstart', handleTap);

        function updateTimer() {
            timeLeft--;
            timerDisplay.textContent = timeLeft + 's';

            if (timeLeft <= 5) {
                timerDisplay.classList.add('timer-warning');
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function startGame() {
            score = 0;
            timeLeft = 25;
            gameActive = true;

            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '25s';
            timerDisplay.classList.remove('timer-warning');

            startScreen.style.display = 'none';
            endScreen.style.display = 'none';

            coin.classList.remove('tap-effect');

            document.querySelectorAll('.tap-particle').forEach(p => p.remove());

            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            const tapsPerSecond = (score / 25).toFixed(2);

            finalScoreDisplay.textContent = score + ' Taps';
            tapsPerSecondDisplay.textContent = tapsPerSecond + ' taps/second';

            const savedName = localStorage.getItem('coinTapperName') || '';
            nameInput.value = savedName;

            addScore(savedName || 'Anonymous', score);
            displayLeaderboard(leaderboardList, currentGameId);

            endScreen.style.display = 'flex';
            endScreen.scrollTop = 0;
        }

        nameInput.addEventListener('input', () => {
            const name = nameInput.value.trim() || 'Anonymous';
            localStorage.setItem('coinTapperName', nameInput.value.trim());

            const leaderboard = getLeaderboard();
            const currentEntry = leaderboard.find(e => e.id === currentGameId);
            if (currentEntry) {
                currentEntry.name = name;
                saveLeaderboard(leaderboard);
                displayLeaderboard(leaderboardList, currentGameId);
            }
        });

        nameInput.addEventListener('blur', () => {
            window.scrollTo(0, 0);
        });

        startButton.addEventListener('click', () => {
            startGame();
        });

        restartButton.addEventListener('click', () => {
            startGame();
        });

        displayLeaderboard(leaderboardStartList);
    </script>
</body>
</html>
