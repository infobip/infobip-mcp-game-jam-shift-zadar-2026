<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Catch the Stars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1e3e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }

        #basket {
            position: absolute;
            width: 80px;
            height: 60px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            touch-action: none;
            cursor: pointer;
        }

        .star {
            position: absolute;
            width: 30px;
            height: 30px;
            font-size: 30px;
            pointer-events: none;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(10, 14, 39, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        #game-over-screen {
            display: none;
        }

        h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .instruction {
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .button {
            background: linear-gradient(to bottom, #ffd700, #ffaa00);
            color: #0a0e27;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .button:active {
            transform: scale(0.95);
        }

        #final-score {
            color: #ffd700;
            font-size: 36px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">Score: 0</div>

        <div id="basket">🧺</div>

        <div id="start-screen">
            <h1>⭐ Catch the Stars ⭐</h1>
            <p class="instruction">Tap and drag the basket to catch falling stars!<br>The game gets faster as you score more.</p>
            <button class="button" id="start-button">Start Game</button>
        </div>

        <div id="game-over-screen">
            <h1>Game Over!</h1>
            <div id="final-score">Score: 0</div>
            <button class="button" id="restart-button">Play Again</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const scoreDisplay = document.getElementById('score-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let gameActive = false;
        let stars = [];
        let missedStars = 0;
        let basketX = window.innerWidth / 2;
        let animationId;

        const basketWidth = 80;
        const basketHeight = 60;
        const starSize = 30;

        function updateBasketPosition(x) {
            basketX = Math.max(basketWidth / 2, Math.min(window.innerWidth - basketWidth / 2, x));
            basket.style.left = basketX + 'px';
            basket.style.transform = 'translateX(-50%)';
        }

        basket.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            function onPointerMove(e) {
                if (gameActive) {
                    updateBasketPosition(e.clientX);
                }
            }

            function onPointerUp() {
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
            }

            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        });

        gameContainer.addEventListener('pointermove', (e) => {
            if (gameActive && e.target !== basket) {
                updateBasketPosition(e.clientX);
            }
        });

        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '⭐';
            star.style.left = Math.random() * (window.innerWidth - starSize) + 'px';
            star.style.top = '-30px';

            const starData = {
                element: star,
                x: parseFloat(star.style.left),
                y: -30,
                speed: 2 + Math.min(score * 0.1, 5)
            };

            gameContainer.appendChild(star);
            stars.push(starData);
        }

        function checkCollision(star) {
            const basketLeft = basketX - basketWidth / 2;
            const basketRight = basketX + basketWidth / 2;
            const basketTop = window.innerHeight - 20 - basketHeight;

            const starLeft = star.x;
            const starRight = star.x + starSize;
            const starBottom = star.y + starSize;

            return starBottom >= basketTop &&
                   starBottom <= window.innerHeight - 20 &&
                   starRight >= basketLeft &&
                   starLeft <= basketRight;
        }

        function updateGame() {
            if (!gameActive) return;

            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.y += star.speed;
                star.element.style.top = star.y + 'px';

                if (checkCollision(star)) {
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                    star.element.remove();
                    stars.splice(i, 1);
                } else if (star.y > window.innerHeight) {
                    star.element.remove();
                    stars.splice(i, 1);
                    missedStars++;

                    if (missedStars >= 10) {
                        endGame();
                        return;
                    }
                }
            }

            if (Math.random() < 0.02 + score * 0.001) {
                createStar();
            }

            animationId = requestAnimationFrame(updateGame);
        }

        function startGame() {
            score = 0;
            missedStars = 0;
            stars = [];
            gameActive = true;

            scoreDisplay.textContent = 'Score: 0';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            document.querySelectorAll('.star').forEach(star => star.remove());

            updateBasketPosition(window.innerWidth / 2);

            animationId = requestAnimationFrame(updateGame);
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);

            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);

        updateBasketPosition(window.innerWidth / 2);
    </script>
</body>
</html>
