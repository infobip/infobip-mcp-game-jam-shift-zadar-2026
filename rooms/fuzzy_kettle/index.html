<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Coin Tapper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            max-width: 100%;
            height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: manipulation;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #stats {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #score {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #timer {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #coin-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f9d423 0%, #ff4e50 100%);
            border: 8px solid #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 -5px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            transition: transform 0.1s;
            user-select: none;
        }

        #coin:active {
            transform: scale(0.9);
        }

        #coin.tap-effect {
            animation: tap-pulse 0.3s ease-out;
        }

        @keyframes tap-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tap-particle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        #start-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 30px;
        }

        #end-screen {
            display: none;
        }

        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
        }

        .instruction {
            color: white;
            font-size: 20px;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .start-btn {
            background: linear-gradient(145deg, #f9d423 0%, #ff4e50 100%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 240px;
            min-height: 70px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        #final-score {
            color: white;
            font-size: 42px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
        }

        #taps-per-second {
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            margin-bottom: 40px;
            text-align: center;
        }

        .timer-warning {
            animation: pulse-red 0.5s ease-in-out infinite;
        }

        @keyframes pulse-red {
            0%, 100% { color: #fff; }
            50% { color: #ff4e50; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats">
            <div id="score">0</div>
            <div id="timer">25s</div>
        </div>

        <div id="coin-container">
            <div id="coin">🪙</div>
        </div>

        <div id="start-screen">
            <h1>🪙 Coin Tapper 🪙</h1>
            <p class="instruction">Tap the coin as fast as you can!<br><br>Each tap = 1 point<br>You have 25 seconds<br><br>How fast can you tap?</p>
            <button class="start-btn" id="start-button">Start Tapping!</button>
        </div>

        <div id="end-screen">
            <h1>Time's Up!</h1>
            <div id="final-score">0 Taps</div>
            <div id="taps-per-second">0 taps/second</div>
            <button class="start-btn" id="restart-button">Tap Again!</button>
        </div>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const finalScoreDisplay = document.getElementById('final-score');
        const tapsPerSecondDisplay = document.getElementById('taps-per-second');
        const coinContainer = document.getElementById('coin-container');

        let score = 0;
        let gameActive = false;
        let timeLeft = 25;
        let timerInterval;

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'tap-particle';
            particle.textContent = '+1';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            coinContainer.appendChild(particle);

            setTimeout(() => particle.remove(), 1000);
        }

        function handleTap(e) {
            if (!gameActive) return;

            e.preventDefault();

            score++;
            scoreDisplay.textContent = score;

            coin.classList.remove('tap-effect');
            void coin.offsetWidth;
            coin.classList.add('tap-effect');

            const rect = coinContainer.getBoundingClientRect();
            const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - rect.left;
            const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - rect.top;
            createParticle(x, y);
        }

        coin.addEventListener('pointerdown', handleTap);
        coin.addEventListener('touchstart', handleTap);

        function updateTimer() {
            timeLeft--;
            timerDisplay.textContent = timeLeft + 's';

            if (timeLeft <= 5) {
                timerDisplay.classList.add('timer-warning');
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function startGame() {
            score = 0;
            timeLeft = 25;
            gameActive = true;

            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '25s';
            timerDisplay.classList.remove('timer-warning');

            startScreen.style.display = 'none';
            endScreen.style.display = 'none';

            coin.classList.remove('tap-effect');

            document.querySelectorAll('.tap-particle').forEach(p => p.remove());

            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            const tapsPerSecond = (score / 25).toFixed(2);

            finalScoreDisplay.textContent = score + ' Taps';
            tapsPerSecondDisplay.textContent = tapsPerSecond + ' taps/second';

            endScreen.style.display = 'flex';
        }

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
    </script>
</body>
</html>
