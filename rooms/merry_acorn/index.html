<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Game Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
        }
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #menu h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 50px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .menu-button {
            width: 280px;
            height: 70px;
            margin: 15px;
            background: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .menu-button:active {
            transform: scale(0.95);
        }
        #characterSelect {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        #characterSelect h2 {
            color: white;
            font-size: 32px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .character-button {
            width: 280px;
            height: 120px;
            margin: 15px;
            background: white;
            border: none;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .character-button:active {
            transform: scale(0.95);
        }
        .character-button.female {
            color: #f5576c;
        }
        .character-button.male {
            color: #4a90e2;
        }
        .character-emoji {
            font-size: 48px;
            margin-bottom: 5px;
        }
        #gameCanvas {
            display: none;
            width: 100%;
            height: 100dvh;
            background: #2a2a2a;
            touch-action: none;
        }
        #hud {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #driftScore {
            color: #ff6b35;
            font-size: 24px;
            font-weight: bold;
        }
        #toiletHud {
            display: none;
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #urgencyBar {
            width: 80%;
            max-width: 400px;
            height: 30px;
            background: rgba(0,0,0,0.3);
            border: 3px solid white;
            border-radius: 15px;
            margin: 10px auto;
            overflow: hidden;
        }
        #urgencyFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #FFC107 50%, #F44336 100%);
            transition: width 0.3s;
        }
        #joystick {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 100;
        }
        #joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255,107,53,0.8);
            border: 2px solid white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #gasButton {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: rgba(76,175,80,0.7);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            touch-action: none;
            z-index: 100;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        #gasButton:active {
            background: rgba(76,175,80,0.9);
            transform: scale(0.95);
        }
        #dpadContainer {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            z-index: 100;
        }
        .dpad-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 15px;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .dpad-btn:active {
            background: rgba(255,255,255,0.4);
            transform: scale(0.9);
        }
        #upBtn {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        #downBtn {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        #leftBtn {
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        #rightBtn {
            top: 50%;
            right: 0;
            transform: translateY(-50%);
        }
        #backButton {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            border-radius: 50%;
            touch-action: manipulation;
            z-index: 1000;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }
        #backButton:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Choose Your Game</h1>
        <button class="menu-button" id="driftBtn">Drift Racer</button>
        <button class="menu-button" id="toiletBtn">Toilet Rush</button>
    </div>

    <div id="characterSelect">
        <h2>Choose Your Character</h2>
        <button class="character-button female" id="martinaBtn">
            <div class="character-emoji">👩</div>
            <div>Martina</div>
        </button>
        <button class="character-button male" id="cabyBtn">
            <div class="character-emoji">👨</div>
            <div>Caby</div>
        </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div>Speed: <span id="speed">0</span> km/h</div>
        <div id="driftScore">Drift: <span id="drift">0</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <div id="toiletHud">
        <div style="font-size: 28px; font-weight: bold;">REACH THE TOILET!</div>
        <div id="urgencyBar"><div id="urgencyFill" style="width: 100%;"></div></div>
        <div>Progress: <span id="distance">0</span>m</div>
    </div>

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>
    <div id="gasButton">GAS</div>

    <div id="dpadContainer">
        <button class="dpad-btn" id="upBtn">↑</button>
        <button class="dpad-btn" id="leftBtn">←</button>
        <button class="dpad-btn" id="rightBtn">→</button>
        <button class="dpad-btn" id="downBtn">↓</button>
    </div>

    <button id="backButton">←</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentGame = null;
        let selectedCharacter = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Menu navigation
        document.getElementById('driftBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startDriftGame();
        });

        document.getElementById('toiletBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            showCharacterSelect();
        });

        document.getElementById('martinaBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            selectedCharacter = 'martina';
            startToiletGame();
        });

        document.getElementById('cabyBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            selectedCharacter = 'caby';
            startToiletGame();
        });

        document.getElementById('backButton').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            backToMenu();
        });

        function showCharacterSelect() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('characterSelect').style.display = 'flex';
        }

        function backToMenu() {
            currentGame = null;
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('characterSelect').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('toiletHud').style.display = 'none';
            document.getElementById('joystick').style.display = 'none';
            document.getElementById('gasButton').style.display = 'none';
            document.getElementById('dpadContainer').style.display = 'none';
            document.getElementById('backButton').style.display = 'none';
        }

        // DRIFT GAME
        function startDriftGame() {
            currentGame = 'drift';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('joystick').style.display = 'block';
            document.getElementById('gasButton').style.display = 'flex';
            document.getElementById('backButton').style.display = 'block';
            initDriftGame();
        }

        const driftGame = {
            car: {
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
                angle: 0,
                speed: 0,
                drift: 0,
                driftScore: 0,
                totalScore: 0
            },
            camera: { x: 0, y: 0 },
            waypoints: []
        };

        function initDriftGame() {
            driftGame.car = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: 0,
                vy: 0,
                angle: 0,
                speed: 0,
                drift: 0,
                driftScore: 0,
                totalScore: 0
            };

            driftGame.waypoints = [];
            const numWaypoints = 20;
            for (let i = 0; i < numWaypoints; i++) {
                const angle = (i / numWaypoints) * Math.PI * 2;
                const radius = 300 + Math.sin(i * 0.7) * 150;
                driftGame.waypoints.push({
                    x: Math.cos(angle) * radius,
                    y: Math.sin(angle) * radius
                });
            }
        }

        function updateDriftGame() {
            const car = driftGame.car;
            const steerAngle = Math.atan2(controls.steerY, controls.steerX);
            const steerMagnitude = Math.sqrt(controls.steerX ** 2 + controls.steerY ** 2);

            if (steerMagnitude > 0.1) {
                const targetAngle = steerAngle - Math.PI / 2;
                let angleDiff = targetAngle - car.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                car.angle += angleDiff * 0.08 * steerMagnitude;
            }

            if (controls.gas) {
                const ax = Math.sin(car.angle) * 0.4;
                const ay = -Math.cos(car.angle) * 0.4;
                car.vx += ax;
                car.vy += ay;
            }

            car.speed = Math.sqrt(car.vx ** 2 + car.vy ** 2);

            if (car.speed > 15) {
                car.vx = (car.vx / car.speed) * 15;
                car.vy = (car.vy / car.speed) * 15;
                car.speed = 15;
            }

            const velocityAngle = Math.atan2(car.vy, car.vx);
            const carDirection = car.angle + Math.PI / 2;
            let driftAngle = velocityAngle - carDirection;
            while (driftAngle > Math.PI) driftAngle -= Math.PI * 2;
            while (driftAngle < -Math.PI) driftAngle += Math.PI * 2;

            car.drift = Math.abs(driftAngle);

            if (car.drift > 0.3 && car.speed > 3) {
                car.vx *= 0.92;
                car.vy *= 0.92;
                car.driftScore += car.speed * car.drift * 0.5;
                car.totalScore += car.speed * car.drift * 0.1;
            } else {
                car.vx *= 0.96;
                car.vy *= 0.96;
                car.driftScore *= 0.95;
            }

            car.vx *= 0.98;
            car.vy *= 0.98;
            car.x += car.vx;
            car.y += car.vy;

            driftGame.camera.x = car.x - canvas.width / 2;
            driftGame.camera.y = car.y - canvas.height / 2;

            document.getElementById('speed').textContent = Math.round(car.speed * 10);
            document.getElementById('drift').textContent = Math.round(car.driftScore);
            document.getElementById('score').textContent = Math.round(car.totalScore);
        }

        function renderDriftGame() {
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-driftGame.camera.x, -driftGame.camera.y);

            ctx.strokeStyle = 'rgba(100, 100, 100, 0.3)';
            ctx.lineWidth = 200;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let i = 0; i < driftGame.waypoints.length; i++) {
                const wp = driftGame.waypoints[i];
                if (i === 0) {
                    ctx.moveTo(wp.x, wp.y);
                } else {
                    ctx.lineTo(wp.x, wp.y);
                }
            }
            ctx.closePath();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            for (let i = 0; i < driftGame.waypoints.length; i++) {
                const wp = driftGame.waypoints[i];
                if (i === 0) {
                    ctx.moveTo(wp.x, wp.y);
                } else {
                    ctx.lineTo(wp.x, wp.y);
                }
            }
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);

            const car = driftGame.car;
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            ctx.fillStyle = car.drift > 0.5 ? '#ff6b35' : '#4CAF50';
            ctx.fillRect(-15, -25, 30, 50);

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(-10, -15, 20, 15);

            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(-12, -27, 8, 4);
            ctx.fillRect(4, -27, 8, 4);

            ctx.restore();
            ctx.restore();
        }

        // TOILET GAME - Crossy Road Style
        function startToiletGame() {
            currentGame = 'toilet';
            document.getElementById('characterSelect').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('toiletHud').style.display = 'block';
            document.getElementById('dpadContainer').style.display = 'block';
            document.getElementById('backButton').style.display = 'block';
            initToiletGame();
        }

        const TILE_SIZE = 60;
        const toiletGame = {
            player: {
                x: 0,
                y: 0,
                gridX: 0,
                gridY: 0
            },
            camera: 0,
            urgency: 100,
            progress: 0,
            gameOver: false,
            won: false,
            lanes: [],
            toiletY: -3000,
            moveDelay: 0
        };

        function initToiletGame() {
            const startGridX = Math.floor(canvas.width / 2 / TILE_SIZE);
            const startGridY = -2;

            toiletGame.player = {
                x: startGridX * TILE_SIZE + TILE_SIZE / 2,
                y: startGridY * TILE_SIZE,
                gridX: startGridX,
                gridY: startGridY
            };

            toiletGame.camera = 0;
            toiletGame.urgency = 100;
            toiletGame.progress = 0;
            toiletGame.gameOver = false;
            toiletGame.won = false;
            toiletGame.lanes = [];
            toiletGame.toiletY = -3000;
            toiletGame.moveDelay = 0;

            generateLanes();
        }

        function generateLanes() {
            toiletGame.lanes = [];

            for (let i = 0; i < 60; i++) {
                const y = -i * TILE_SIZE;
                const rand = Math.random();

                if (i < 3 || i === 59) {
                    toiletGame.lanes.push({ type: 'safe', y: y, obstacles: [] });
                } else if (rand < 0.3) {
                    toiletGame.lanes.push({ type: 'safe', y: y, obstacles: [] });
                } else if (rand < 0.65) {
                    const direction = Math.random() > 0.5 ? 1 : -1;
                    const speed = 1.5 + Math.random() * 2;
                    const obstacles = [];
                    const gap = 180 + Math.random() * 150;
                    for (let j = -200; j < canvas.width + 400; j += gap) {
                        obstacles.push({
                            x: j + Math.random() * 50,
                            width: 80 + Math.random() * 40,
                            height: 45,
                            direction: direction,
                            speed: speed
                        });
                    }
                    toiletGame.lanes.push({ type: 'road', y: y, obstacles: obstacles });
                } else {
                    const direction = Math.random() > 0.5 ? 1 : -1;
                    const speed = 1 + Math.random() * 1.5;
                    const obstacles = [];
                    const gap = 140 + Math.random() * 80;
                    for (let j = -200; j < canvas.width + 400; j += gap) {
                        obstacles.push({
                            x: j + Math.random() * 30,
                            width: 90 + Math.random() * 40,
                            height: 35,
                            direction: direction,
                            speed: speed,
                            isLog: true
                        });
                    }
                    toiletGame.lanes.push({ type: 'river', y: y, obstacles: obstacles });
                }
            }
        }

        function movePlayer(dx, dy) {
            if (toiletGame.gameOver || toiletGame.won || toiletGame.moveDelay > 0) return;

            toiletGame.player.gridX += dx;
            toiletGame.player.gridY += dy;
            toiletGame.player.x = toiletGame.player.gridX * TILE_SIZE + TILE_SIZE / 2;
            toiletGame.player.y = toiletGame.player.gridY * TILE_SIZE;
            toiletGame.moveDelay = 8;
        }

        document.getElementById('upBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            movePlayer(0, -1);
        });

        document.getElementById('downBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            movePlayer(0, 1);
        });

        document.getElementById('leftBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            movePlayer(-1, 0);
        });

        document.getElementById('rightBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            movePlayer(1, 0);
        });

        function updateToiletGame() {
            if (toiletGame.gameOver || toiletGame.won) return;

            if (toiletGame.moveDelay > 0) {
                toiletGame.moveDelay--;
            }

            const p = toiletGame.player;
            toiletGame.camera = p.y - canvas.height * 0.7;

            for (const lane of toiletGame.lanes) {
                if (lane.type === 'road' || lane.type === 'river') {
                    for (const obs of lane.obstacles) {
                        obs.x += obs.direction * obs.speed;
                        if (obs.direction > 0 && obs.x > canvas.width + 300) {
                            obs.x = -200;
                        } else if (obs.direction < 0 && obs.x < -300) {
                            obs.x = canvas.width + 200;
                        }
                    }
                }
            }

            const playerLaneIndex = Math.abs(Math.floor(p.y / TILE_SIZE));
            if (playerLaneIndex >= 0 && playerLaneIndex < toiletGame.lanes.length) {
                const lane = toiletGame.lanes[playerLaneIndex];

                if (lane.type === 'road') {
                    for (const obs of lane.obstacles) {
                        if (p.x > obs.x - 20 && p.x < obs.x + obs.width + 20 &&
                            Math.abs(p.y - lane.y) < 25) {
                            toiletGame.gameOver = true;
                        }
                    }
                } else if (lane.type === 'river') {
                    let onLog = false;
                    for (const obs of lane.obstacles) {
                        if (p.x > obs.x + 5 && p.x < obs.x + obs.width - 5 &&
                            Math.abs(p.y - lane.y) < 25) {
                            onLog = true;
                            p.x += obs.direction * obs.speed;
                            p.gridX = Math.round(p.x / TILE_SIZE);
                        }
                    }
                    if (!onLog) {
                        toiletGame.gameOver = true;
                    }
                }
            }

            const maxX = canvas.width - TILE_SIZE / 2;
            const minX = TILE_SIZE / 2;
            if (p.x < minX || p.x > maxX) {
                toiletGame.gameOver = true;
            }

            toiletGame.urgency -= 0.035;
            if (toiletGame.urgency <= 0) {
                toiletGame.gameOver = true;
            }

            toiletGame.progress = Math.max(0, Math.floor(-p.y / 10));
            document.getElementById('distance').textContent = toiletGame.progress;
            document.getElementById('urgencyFill').style.width = Math.max(0, toiletGame.urgency) + '%';

            if (p.y < toiletGame.toiletY + 100) {
                toiletGame.won = true;
            }
        }

        function renderToiletGame() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, toiletGame.camera);

            const startLane = Math.floor(-toiletGame.camera / TILE_SIZE) - 2;
            const endLane = Math.ceil((-toiletGame.camera + canvas.height) / TILE_SIZE) + 2;

            for (let i = Math.max(0, startLane); i < Math.min(toiletGame.lanes.length, endLane); i++) {
                const lane = toiletGame.lanes[i];
                const y = -lane.y;

                if (lane.type === 'safe') {
                    ctx.fillStyle = i % 2 === 0 ? '#7cb342' : '#689f38';
                    ctx.fillRect(0, y, canvas.width, TILE_SIZE);
                } else if (lane.type === 'road') {
                    ctx.fillStyle = '#424242';
                    ctx.fillRect(0, y, canvas.width, TILE_SIZE);

                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([15, 15]);
                    ctx.beginPath();
                    ctx.moveTo(0, y + TILE_SIZE / 2);
                    ctx.lineTo(canvas.width, y + TILE_SIZE / 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    for (const obs of lane.obstacles) {
                        const carColors = ['#e53935', '#1e88e5', '#43a047', '#fb8c00'];
                        ctx.fillStyle = carColors[Math.floor(obs.x / 300) % carColors.length];
                        ctx.fillRect(obs.x, y + 7, obs.width, obs.height);

                        ctx.fillStyle = '#ffffff';
                        if (obs.direction > 0) {
                            ctx.fillRect(obs.x + obs.width - 15, y + 10, 10, 8);
                            ctx.fillRect(obs.x + obs.width - 15, y + 27, 10, 8);
                        } else {
                            ctx.fillRect(obs.x + 5, y + 10, 10, 8);
                            ctx.fillRect(obs.x + 5, y + 27, 10, 8);
                        }
                    }
                } else if (lane.type === 'river') {
                    ctx.fillStyle = '#1976d2';
                    ctx.fillRect(0, y, canvas.width, TILE_SIZE);

                    for (const obs of lane.obstacles) {
                        ctx.fillStyle = '#795548';
                        ctx.fillRect(obs.x, y + 12, obs.width, obs.height);
                        ctx.fillStyle = '#5d4037';
                        for (let r = 0; r < 3; r++) {
                            ctx.fillRect(obs.x + 10 + r * 25, y + 15, 15, obs.height - 6);
                        }
                    }
                }
            }

            const toiletY = -toiletGame.toiletY;
            ctx.fillStyle = '#ffd54f';
            ctx.fillRect(0, toiletY - 100, canvas.width, 100);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(canvas.width / 2 - 40, toiletY - 80, 80, 70);
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(canvas.width / 2 - 35, toiletY - 75, 70, 40);
            ctx.fillStyle = '#333';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🚽', canvas.width / 2, toiletY - 30);

            const p = toiletGame.player;
            ctx.fillStyle = selectedCharacter === 'martina' ? '#f5576c' : '#4a90e2';
            ctx.beginPath();
            ctx.arc(p.x, -p.y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(selectedCharacter === 'martina' ? '👩' : '👨', p.x, -p.y + 13);

            ctx.restore();

            if (toiletGame.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#F44336';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillStyle = 'white';
                ctx.fillText('Progress: ' + toiletGame.progress + 'm', canvas.width / 2, canvas.height / 2 + 50);
                ctx.fillText('Tap back to try again', canvas.width / 2, canvas.height / 2 + 90);
            } else if (toiletGame.won) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#4CAF50';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SUCCESS!', canvas.width / 2, canvas.height / 2);
                ctx.font = '28px Arial';
                ctx.fillStyle = 'white';
                ctx.fillText('Made it to the toilet!', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        // Controls
        const controls = {
            steerX: 0,
            steerY: 0,
            gas: false
        };

        const joystick = document.getElementById('joystick');
        const joystickKnob = document.getElementById('joystickKnob');
        let joystickActive = false;
        let joystickId = null;

        joystick.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            joystickActive = true;
            joystickId = e.pointerId;
            joystick.setPointerCapture(e.pointerId);
            updateJoystick(e);
        });

        joystick.addEventListener('pointermove', (e) => {
            if (joystickActive && e.pointerId === joystickId) {
                e.preventDefault();
                updateJoystick(e);
            }
        });

        joystick.addEventListener('pointerup', (e) => {
            if (e.pointerId === joystickId) {
                e.preventDefault();
                joystickActive = false;
                joystickId = null;
                controls.steerX = 0;
                controls.steerY = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            }
        });

        joystick.addEventListener('pointercancel', (e) => {
            if (e.pointerId === joystickId) {
                joystickActive = false;
                joystickId = null;
                controls.steerX = 0;
                controls.steerY = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            }
        });

        function updateJoystick(e) {
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const x = e.clientX - rect.left - centerX;
            const y = e.clientY - rect.top - centerY;

            const distance = Math.sqrt(x * x + y * y);
            const maxDistance = 35;

            if (distance > maxDistance) {
                const angle = Math.atan2(y, x);
                controls.steerX = Math.cos(angle);
                controls.steerY = Math.sin(angle);
                joystickKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * maxDistance}px), calc(-50% + ${Math.sin(angle) * maxDistance}px))`;
            } else {
                controls.steerX = x / maxDistance;
                controls.steerY = y / maxDistance;
                joystickKnob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            }
        }

        const gasButton = document.getElementById('gasButton');
        gasButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            controls.gas = true;
        });

        gasButton.addEventListener('pointerup', (e) => {
            e.preventDefault();
            controls.gas = false;
        });

        gasButton.addEventListener('pointercancel', (e) => {
            e.preventDefault();
            controls.gas = false;
        });

        // Game loop
        function gameLoop() {
            if (currentGame === 'drift') {
                updateDriftGame();
                renderDriftGame();
            } else if (currentGame === 'toilet') {
                updateToiletGame();
                renderToiletGame();
            }
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
