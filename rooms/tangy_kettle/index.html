<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Flower Rush!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            touch-action: none;
            user-select: none;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .stat {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
            background: rgba(255, 255, 255, 0.1);
        }

        .circle svg {
            width: 85%;
            height: 85%;
            pointer-events: none;
        }

        .circle:active {
            transform: scale(0.9);
        }

        .lawn-mower {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%) !important;
            border: 3px solid #fff;
            font-size: 40px;
            animation: mowerMove 2s linear;
            pointer-events: none;
            cursor: default;
        }

        @keyframes mowerMove {
            0% { transform: translateX(-100px) rotate(0deg); }
            100% { transform: translateX(100px) rotate(360deg); }
        }

        .frog {
            background: radial-gradient(circle, #90ee90 0%, #228b22 100%) !important;
            border: 2px solid #006400;
            font-size: 36px;
            animation: frogHop 0.5s ease-in-out infinite;
        }

        @keyframes frogHop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 18px 48px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            min-width: 200px;
            min-height: 60px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #finalScore {
            color: #ffd700;
            font-size: 36px;
            margin: 20px 0;
            font-weight: bold;
        }

        .instructions {
            color: white;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            max-width: 400px;
        }

        .hearts {
            display: flex;
            gap: 8px;
        }

        .heart {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="header">
            <div class="stat">Score: <span id="score">0</span></div>
            <div class="stat">
                <div class="hearts" id="lives"></div>
            </div>
        </div>

        <div id="startScreen">
            <h1>Flower Rush!</h1>
            <p class="instructions">Tap flowers before they wilt! DON'T tap the frogs! Watch the lawn mower clear flowers automatically!</p>
            <button class="btn" id="startBtn">Start Game</button>
        </div>

        <div id="gameOverScreen">
            <h1>Game Over!</h1>
            <div id="finalScore">Score: 0</div>
            <button class="btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const finalScoreDisplay = document.getElementById('finalScore');

        let score = 0;
        let lives = 5;
        let gameActive = false;
        let spawnInterval;
        let difficultyInterval;
        let lawnMowerInterval;
        let frogInterval;
        let circles = [];
        let spawnRate = 800;

        function createFlowerSVG(petals, petalColor, centerColor) {
            const center = 50;
            const petalLength = 35;
            const petalWidth = 15;
            const centerRadius = 12;

            let petalsPaths = '';
            for (let i = 0; i < petals; i++) {
                const angle = (i * 360 / petals) * Math.PI / 180;
                const x = center + Math.cos(angle) * 25;
                const y = center + Math.sin(angle) * 25;
                const rotation = i * 360 / petals;

                petalsPaths += `<ellipse cx="${x}" cy="${y}" rx="${petalWidth}" ry="${petalLength}" transform="rotate(${rotation} ${x} ${y})" fill="${petalColor}" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>`;
            }

            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                ${petalsPaths}
                <circle cx="${center}" cy="${center}" r="${centerRadius}" fill="${centerColor}" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
            </svg>`;
        }

        function getFlowerColors(points) {
            if (points <= 6) {
                return { petal: '#fff9c4', center: '#fdd835' };
            } else if (points === 7) {
                return { petal: '#ffe0b2', center: '#ff9800' };
            } else if (points === 8) {
                return { petal: '#f8bbd0', center: '#e91e63' };
            } else if (points === 9) {
                return { petal: '#ffccbc', center: '#ff5722' };
            } else {
                return { petal: '#ce93d8', center: '#9c27b0' };
            }
        }

        function updateLivesDisplay() {
            livesDisplay.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = '❤️';
                livesDisplay.appendChild(heart);
            }
        }

        function loseLife() {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
                endGame();
            }
        }

        function createFrog() {
            if (!gameActive) return;

            const circle = document.createElement('div');
            circle.className = 'circle frog';
            circle.dataset.type = 'frog';

            const size = 70;
            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.textContent = '🐸';

            const maxX = window.innerWidth - size - 20;
            const maxY = window.innerHeight - size - 120;
            const minY = 100;

            circle.style.left = (20 + Math.random() * maxX) + 'px';
            circle.style.top = (minY + Math.random() * (maxY - minY)) + 'px';

            gameContainer.appendChild(circle);
            circles.push(circle);

            circle.style.opacity = '0';
            circle.style.transform = 'scale(0)';
            setTimeout(() => {
                circle.style.transition = 'opacity 0.3s, transform 0.3s';
                circle.style.opacity = '1';
                circle.style.transform = 'scale(1)';
            }, 10);

            setTimeout(() => {
                if (circle.parentNode && gameActive) {
                    circle.style.transition = 'opacity 0.3s, transform 0.3s';
                    circle.style.opacity = '0';
                    circle.style.transform = 'scale(0)';
                    setTimeout(() => {
                        if (circle.parentNode) {
                            circle.remove();
                        }
                        circles = circles.filter(c => c !== circle);
                    }, 300);
                }
            }, 3000);

            circle.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (!gameActive) return;

                loseLife();

                circle.style.transition = 'opacity 0.2s, transform 0.2s';
                circle.style.opacity = '0';
                circle.style.transform = 'scale(2)';

                setTimeout(() => {
                    if (circle.parentNode) {
                        circle.remove();
                    }
                    circles = circles.filter(c => c !== circle);
                }, 200);
            });
        }

        function createLawnMower() {
            if (!gameActive) return;

            const circle = document.createElement('div');
            circle.className = 'circle lawn-mower';

            const size = 90;
            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.textContent = '🚜';

            const maxX = window.innerWidth - size - 20;
            const maxY = window.innerHeight - size - 120;
            const minY = 100;

            circle.style.left = (20 + Math.random() * maxX) + 'px';
            circle.style.top = (minY + Math.random() * (maxY - minY)) + 'px';

            gameContainer.appendChild(circle);

            circle.style.opacity = '0';
            setTimeout(() => {
                circle.style.transition = 'opacity 0.3s';
                circle.style.opacity = '1';
            }, 10);

            setTimeout(() => {
                const allFlowers = circles.filter(c => !c.dataset.type);
                let clearedCount = 0;

                allFlowers.forEach(flower => {
                    if (flower.parentNode) {
                        flower.style.transition = 'opacity 0.3s, transform 0.3s';
                        flower.style.opacity = '0';
                        flower.style.transform = 'scale(0)';
                        clearedCount++;
                        setTimeout(() => {
                            if (flower.parentNode) {
                                flower.remove();
                            }
                        }, 300);
                    }
                });

                circles = circles.filter(c => c.dataset.type === 'frog');

                score += clearedCount * 3;
                scoreDisplay.textContent = score;
            }, 1000);

            setTimeout(() => {
                if (circle.parentNode) {
                    circle.style.transition = 'opacity 0.3s';
                    circle.style.opacity = '0';
                    setTimeout(() => {
                        if (circle.parentNode) {
                            circle.remove();
                        }
                    }, 300);
                }
            }, 2500);
        }

        function createCircle() {
            if (!gameActive) return;

            const circle = document.createElement('div');
            circle.className = 'circle';

            const size = 60 + Math.random() * 40;
            circle.style.width = size + 'px';
            circle.style.height = size + 'px';

            const maxX = window.innerWidth - size - 20;
            const maxY = window.innerHeight - size - 120;
            const minY = 100;

            circle.style.left = (20 + Math.random() * maxX) + 'px';
            circle.style.top = (minY + Math.random() * (maxY - minY)) + 'px';

            const points = Math.floor(size / 10);
            const colors = getFlowerColors(points);
            const flowerSVG = createFlowerSVG(points, colors.petal, colors.center);

            circle.innerHTML = flowerSVG;

            gameContainer.appendChild(circle);
            circles.push(circle);

            circle.style.opacity = '0';
            circle.style.transform = 'scale(0)';
            setTimeout(() => {
                circle.style.transition = 'opacity 0.3s, transform 0.3s';
                circle.style.opacity = '1';
                circle.style.transform = 'scale(1)';
            }, 10);

            const lifetime = 2500;
            const timeoutId = setTimeout(() => {
                if (circle.parentNode && gameActive) {
                    circle.style.transition = 'opacity 0.3s, transform 0.3s';
                    circle.style.opacity = '0';
                    circle.style.transform = 'scale(0)';
                    setTimeout(() => {
                        if (circle.parentNode) {
                            circle.remove();
                            loseLife();
                        }
                        circles = circles.filter(c => c !== circle);
                    }, 300);
                }
            }, lifetime);

            circle.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (!gameActive) return;

                clearTimeout(timeoutId);

                score += points;
                scoreDisplay.textContent = score;

                circle.style.transition = 'opacity 0.2s, transform 0.2s';
                circle.style.opacity = '0';
                circle.style.transform = 'scale(1.5) rotate(180deg)';

                setTimeout(() => {
                    if (circle.parentNode) {
                        circle.remove();
                    }
                    circles = circles.filter(c => c !== circle);
                }, 200);
            });
        }

        function startGame() {
            score = 0;
            lives = 5;
            spawnRate = 800;
            gameActive = true;

            scoreDisplay.textContent = score;
            updateLivesDisplay();

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            circles.forEach(circle => circle.remove());
            circles = [];

            spawnInterval = setInterval(createCircle, spawnRate);

            difficultyInterval = setInterval(() => {
                if (spawnRate > 300) {
                    spawnRate -= 50;
                    clearInterval(spawnInterval);
                    spawnInterval = setInterval(createCircle, spawnRate);
                }
            }, 10000);

            lawnMowerInterval = setInterval(() => {
                if (gameActive) {
                    createLawnMower();
                }
            }, 20000);

            frogInterval = setInterval(() => {
                if (gameActive && Math.random() > 0.3) {
                    createFrog();
                }
            }, 8000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(difficultyInterval);
            clearInterval(lawnMowerInterval);
            clearInterval(frogInterval);

            circles.forEach(circle => {
                if (circle.parentNode) {
                    circle.remove();
                }
            });
            circles = [];

            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }

        startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });
    </script>
</body>
</html>
