<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bubble Pop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a0000 0%, #330000 50%, #0d0000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: none;
            user-select: none;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(139, 0, 0, 0.03) 2px,
                rgba(139, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        #lightning-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 255, 0.5) 30%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 300;
        }

        #lightning-overlay.flash {
            animation: lightningFlash 0.4s ease-out;
        }

        @keyframes lightningFlash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            20% { opacity: 0; }
            30% { opacity: 0.8; }
            40% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(220, 20, 20, 0.6), 0 4px 10px rgba(0, 0, 0, 0.8);
            border: 2px solid #8B0000;
            z-index: 100;
            text-align: center;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #FF0000;
            text-shadow: 0 0 10px #FF0000;
        }

        #score-label {
            font-size: 14px;
            color: #CC0000;
            margin-top: 5px;
            text-shadow: 0 0 5px #CC0000;
        }

        #lives-board {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(220, 20, 20, 0.6), 0 4px 10px rgba(0, 0, 0, 0.8);
            border: 2px solid #8B0000;
            z-index: 100;
            text-align: center;
        }

        #lives {
            font-size: 24px;
            font-weight: bold;
            color: #FF4444;
            text-shadow: 0 0 10px #FF0000;
        }

        #lives-label {
            font-size: 12px;
            color: #CC0000;
            margin-top: 5px;
            text-shadow: 0 0 5px #CC0000;
        }

        #god-mode-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.85);
            color: #CC0000;
            border: 3px solid #8B0000;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(220, 20, 20, 0.5), 0 4px 10px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            touch-action: manipulation;
            min-width: 180px;
            min-height: 60px;
            z-index: 100;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #CC0000;
        }

        #god-mode-button.active {
            background: linear-gradient(135deg, #8B0000 0%, #FF0000 100%);
            color: #000;
            border-color: #FF0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), 0 4px 10px rgba(0, 0, 0, 0.8);
            animation: godGlow 1s infinite;
            text-shadow: 0 0 10px #FF0000;
        }

        @keyframes godGlow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.4);
            }
        }

        #god-mode-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset -5px -5px 20px rgba(0, 0, 0, 0.5),
                        inset 5px 5px 20px rgba(139, 0, 0, 0.3),
                        0 5px 15px rgba(220, 20, 20, 0.4);
            animation: float 3s ease-in-out;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            filter: drop-shadow(0 0 8px rgba(220, 20, 20, 0.6));
        }

        .bubble.bomb {
            background: rgba(0, 0, 0, 0.9) !important;
            box-shadow: inset -5px -5px 20px rgba(139, 0, 0, 0.5),
                        inset 5px 5px 20px rgba(255, 0, 0, 0.4),
                        0 5px 20px rgba(255, 0, 0, 0.7);
            animation: float 3s ease-in-out, pulse 1s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-30px) scale(0.8) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
            }
            50% {
                filter: brightness(1.5) drop-shadow(0 0 25px rgba(255, 0, 0, 1));
            }
        }

        @keyframes pop {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .bubble.popping {
            animation: pop 0.3s ease-out forwards;
        }

        .bubble.bomb.popping {
            animation: explode 0.5s ease-out forwards;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
            border: 5px solid #8B0000;
            box-shadow: inset 0 0 50px rgba(139, 0, 0, 0.5);
        }

        #game-over-screen h1 {
            font-size: 48px;
            color: #FF0000;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #FF0000, 0 0 40px #8B0000;
            animation: pulse 2s infinite;
        }

        #final-score {
            font-size: 36px;
            color: #CC0000;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #CC0000;
        }

        #restart-button {
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #8B0000 0%, #4B0000 100%);
            color: #FF0000;
            border: 3px solid #FF0000;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 4px 10px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
            text-shadow: 0 0 10px #FF0000;
        }

        #restart-button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        .reward-popup {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #FF0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 1);
            pointer-events: none;
            z-index: 150;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="lightning-overlay"></div>
    <div id="game-container">
        <div id="score-board">
            <div id="score">0</div>
            <div id="score-label">SOULS</div>
        </div>
        <div id="lives-board">
            <div id="lives">5</div>
            <div id="lives-label">LIVES</div>
        </div>
        <button id="god-mode-button">⚡ DEMON MODE</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>💀 GAME OVER 💀</h1>
        <div id="final-score">Souls: 0</div>
        <button id="restart-button">RISE AGAIN</button>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreElement = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        const godModeButton = document.getElementById('god-mode-button');
        const lightningOverlay = document.getElementById('lightning-overlay');

        let score = 0;
        let lives = 5;
        let gameActive = true;
        let bubbleInterval = null;
        let godMode = false;
        let godModeInterval = null;
        let lightningInterval = null;

        const colors = [
            'rgba(139, 0, 0, 0.7)',
            'rgba(75, 0, 0, 0.7)',
            'rgba(85, 0, 0, 0.7)',
            'rgba(100, 0, 0, 0.7)',
            'rgba(60, 0, 0, 0.7)',
            'rgba(120, 0, 0, 0.7)',
            'rgba(90, 0, 0, 0.7)'
        ];

        const smileys = ['😈', '👿', '💀', '👹', '👺', '🤡', '👻', '💩', '🦇', '🕷️', '🕸️', '☠️', '🔥', '⚡', '🗡️'];

        function flashLightning() {
            lightningOverlay.classList.remove('flash');
            void lightningOverlay.offsetWidth;
            lightningOverlay.classList.add('flash');
        }

        function startLightning() {
            flashLightning();
            lightningInterval = setInterval(() => {
                flashLightning();
            }, 5000);
        }

        function toggleGodMode() {
            godMode = !godMode;

            if (godMode) {
                godModeButton.classList.add('active');
                godModeButton.textContent = '⚡ DEMON MODE ON';

                godModeInterval = setInterval(() => {
                    score += 10000;
                    scoreElement.textContent = score;
                }, 1);
            } else {
                godModeButton.classList.remove('active');
                godModeButton.textContent = '⚡ DEMON MODE';

                if (godModeInterval) {
                    clearInterval(godModeInterval);
                    godModeInterval = null;
                }
            }
        }

        godModeButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            toggleGodMode();
        });

        function createBubble() {
            if (!gameActive) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const isBomb = Math.random() < 0.15;

            const size = Math.random() * 40 + 50;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';

            const maxX = window.innerWidth - size;
            const maxY = window.innerHeight - 200;

            bubble.style.left = Math.random() * maxX + 'px';
            bubble.style.top = Math.random() * maxY + 100 + 'px';

            if (isBomb) {
                bubble.classList.add('bomb');
                bubble.textContent = '💣';
                bubble.dataset.isBomb = 'true';
            } else {
                bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
                bubble.textContent = smileys[Math.floor(Math.random() * smileys.length)];
            }

            gameContainer.appendChild(bubble);

            let popped = false;

            bubble.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (!popped) {
                    popped = true;
                    if (isBomb) {
                        popBomb(bubble);
                    } else {
                        popBubble(bubble);
                    }
                }
            });

            setTimeout(() => {
                if (bubble.parentNode && !bubble.classList.contains('popping')) {
                    bubble.remove();
                    if (!popped) {
                        missedBubble();
                    }
                }
            }, 3000);
        }

        function popBubble(bubble) {
            if (bubble.classList.contains('popping')) return;

            bubble.classList.add('popping');
            score += 10;
            scoreElement.textContent = score;

            setTimeout(() => {
                bubble.remove();
            }, 300);
        }

        function popBomb(bubble) {
            if (bubble.classList.contains('popping')) return;

            bubble.classList.add('popping');
            score += 50;
            scoreElement.textContent = score;

            const rect = bubble.getBoundingClientRect();
            const rewardPopup = document.createElement('div');
            rewardPopup.className = 'reward-popup';
            rewardPopup.textContent = '💀 CURSED! +50';
            rewardPopup.style.left = rect.left + rect.width / 2 - 70 + 'px';
            rewardPopup.style.top = rect.top + 'px';
            gameContainer.appendChild(rewardPopup);

            setTimeout(() => {
                rewardPopup.remove();
            }, 1500);

            setTimeout(() => {
                bubble.remove();
            }, 500);
        }

        function missedBubble() {
            if (godMode) return;

            lives--;
            livesElement.textContent = lives;

            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            clearInterval(bubbleInterval);

            if (godModeInterval) {
                clearInterval(godModeInterval);
                godModeInterval = null;
            }

            if (lightningInterval) {
                clearInterval(lightningInterval);
                lightningInterval = null;
            }

            godMode = false;
            godModeButton.classList.remove('active');
            godModeButton.textContent = '⚡ DEMON MODE';

            const allBubbles = document.querySelectorAll('.bubble');
            allBubbles.forEach(b => b.remove());

            finalScoreElement.textContent = 'Souls: ' + score;
            gameOverScreen.classList.remove('hidden');
        }

        function restartGame() {
            score = 0;
            lives = 5;
            gameActive = true;
            godMode = false;

            if (godModeInterval) {
                clearInterval(godModeInterval);
                godModeInterval = null;
            }

            if (lightningInterval) {
                clearInterval(lightningInterval);
                lightningInterval = null;
            }

            godModeButton.classList.remove('active');
            godModeButton.textContent = '⚡ DEMON MODE';

            scoreElement.textContent = score;
            livesElement.textContent = lives;

            gameOverScreen.classList.add('hidden');

            bubbleInterval = setInterval(() => {
                createBubble();
            }, 800);

            createBubble();
            startLightning();
        }

        restartButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            restartGame();
        });

        bubbleInterval = setInterval(() => {
            createBubble();
        }, 800);

        createBubble();
        startLightning();
    </script>
</body>
</html>
