<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bubble Pop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 100;
            text-align: center;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        #score-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset -5px -5px 20px rgba(0, 0, 0, 0.1),
                        inset 5px 5px 20px rgba(255, 255, 255, 0.3),
                        0 5px 15px rgba(0, 0, 0, 0.2);
            animation: float 3s ease-in-out;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-30px) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .bubble.popping {
            animation: pop 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <div id="score">0</div>
            <div id="score-label">SCORE</div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let gameActive = true;
        let bubbleInterval = null;

        const colors = [
            'rgba(255, 107, 107, 0.7)',
            'rgba(78, 205, 196, 0.7)',
            'rgba(255, 195, 113, 0.7)',
            'rgba(199, 121, 208, 0.7)',
            'rgba(99, 205, 218, 0.7)',
            'rgba(255, 159, 243, 0.7)',
            'rgba(132, 250, 176, 0.7)'
        ];

        function createBubble() {
            if (!gameActive) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const size = Math.random() * 40 + 50;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';

            const maxX = window.innerWidth - size;
            const maxY = window.innerHeight - 200;

            bubble.style.left = Math.random() * maxX + 'px';
            bubble.style.top = Math.random() * maxY + 100 + 'px';

            bubble.style.background = colors[Math.floor(Math.random() * colors.length)];

            gameContainer.appendChild(bubble);

            bubble.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                popBubble(bubble);
            });

            setTimeout(() => {
                if (bubble.parentNode && !bubble.classList.contains('popping')) {
                    bubble.remove();
                }
            }, 3000);
        }

        function popBubble(bubble) {
            if (bubble.classList.contains('popping')) return;

            bubble.classList.add('popping');
            score += 10;
            scoreElement.textContent = score;

            setTimeout(() => {
                bubble.remove();
            }, 300);
        }

        bubbleInterval = setInterval(() => {
            createBubble();
        }, 800);

        createBubble();
    </script>
</body>
</html>
