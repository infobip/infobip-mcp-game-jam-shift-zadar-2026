<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>8-Bit Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game {
            display: flex;
            gap: 15px;
            padding: 10px;
        }
        #main {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff00;
        }
        #canvas {
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            background: #000;
            display: block;
            image-rendering: pixelated;
        }
        #side {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 120px;
        }
        .panel {
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            background: #000;
            padding: 10px;
            text-align: center;
        }
        .panel h3 {
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 0 0 8px #00ff00;
        }
        #next-canvas {
            border: 2px solid #003300;
            background: #000;
            margin: 0 auto;
            display: block;
            image-rendering: pixelated;
        }
        .stat {
            font-size: 12px;
            margin: 8px 0;
            text-shadow: 0 0 8px #00ff00;
        }
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            touch-action: none;
        }
        .btn {
            background: #003300;
            border: 3px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            min-height: 50px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        .btn:active {
            background: #00ff00;
            color: #000;
        }
        #rotate { grid-column: 2; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 4px solid #00ff00;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
            z-index: 100;
        }
        #game-over h2 {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="main">
            <h1>8-BIT TETRIS</h1>
            <canvas id="canvas" width="240" height="504"></canvas>
            <div id="controls">
                <button class="btn" id="rotate">ROTATE</button>
                <button class="btn" id="left">LEFT</button>
                <button class="btn" id="down">DROP</button>
                <button class="btn" id="right">RIGHT</button>
            </div>
        </div>
        <div id="side">
            <div class="panel">
                <h3>NEXT</h3>
                <canvas id="next-canvas" width="100" height="100"></canvas>
            </div>
            <div class="panel">
                <div class="stat">SCORE<br><span id="score">0</span></div>
                <div class="stat">LINES<br><span id="lines">0</span></div>
                <div class="stat">LEVEL<br><span id="level">1</span></div>
            </div>
        </div>
