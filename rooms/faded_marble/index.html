<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>8-Bit Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: none;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 100%;
            padding: 5px;
        }

        #score-panel {
            text-align: center;
            font-size: 12px;
            text-shadow: 0 0 10px #00ff00;
        }

        #score-panel h1 {
            font-size: 18px;
            margin-bottom: 5px;
            letter-spacing: 3px;
        }

        #play-area {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            justify-content: center;
        }

        #canvas {
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            background: #000;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 100px;
        }

        #next-panel {
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            background: #000;
            padding: 8px;
            text-align: center;
        }

        #next-panel h3 {
            font-size: 12px;
            margin-bottom: 8px;
            text-shadow: 0 0 8px #00ff00;
        }

        #next-canvas {
            border: 2px solid #003300;
            background: #000;
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 300px;
            touch-action: none;
            margin-bottom: 10px;
        }

        .btn {
            background: #003300;
            border: 3px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            min-height: 50px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        #rotate {
            grid-column: 2;
        }

        #left {
            grid-column: 1;
            grid-row: 2;
        }

        #down {
            grid-column: 2;
            grid-row: 2;
        }

        #right {
            grid-column: 3;
            grid-row: 2;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 4px solid #00ff00;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
            z-index: 1000;
        }

        #game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        #restart {
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-panel">
            <h1>8-BIT TETRIS</h1>
            <div>SCORE: <span id="score">0</span></div>
            <div>LINES: <span id="lines">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
        </div>

        <div id="play-area">
            <canvas id="canvas" width="240" height="432"></canvas>
            <div id="side-panel">
                <div id="next-panel">
                    <h3>NEXT</h3>
                    <canvas id="next-canvas" width="96" height="96"></canvas>
                </div>
            </div>
        </div>

        <div id="controls">
            <button class="btn" id="rotate">ROTATE</button>
            <button class="btn" id="left">LEFT</button>
            <button class="btn" id="down">DOWN</button>
            <button class="btn" id="right">RIGHT</button>
        </div>
    </div>

    <div id="game-over">
        <h2>GAME OVER</h2>
        <div>FINAL SCORE: <span id="final-score">0</span></div>
        <button class="btn" id="restart">RESTART</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 18;
        const BLOCK_SIZE = 24;

        // 8-bit color palette
        const COLORS = [
            '#000000', // empty
            '#ff0000', // I
            '#00ff00', // O
            '#0000ff', // T
            '#ffff00', // S
            '#ff00ff', // Z
            '#00ffff', // J
            '#ff8800'  // L
        ];

        // Tetromino shapes
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]], // Z
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]]  // L
        ];

        let board = [];
        let score = 0;
        let lines = 0;
        let level = 1;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let gameRunning = true;

        let currentPiece = null;
        let nextPiece = null;
        let currentX = 0;
        let currentY = 0;

        // Epic Space Music
        let audioContext = null;
        let musicStarted = false;

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playNote(frequency, startTime, duration, type = 'square', volume = 0.1) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(frequency, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playChord(frequencies, startTime, duration, type = 'sawtooth') {
            frequencies.forEach(freq => {
                playNote(freq, startTime, duration, type, 0.06);
            });
        }

        function playBassNote(frequency, startTime, duration) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(frequency, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.15, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function startMusic() {
            if (musicStarted || !audioContext) return;
            musicStarted = true;

            const bpm = 140;
            const beatDuration = 60 / bpm;

            // Epic heroic melody - Star Wars inspired
            const melody = [
                [392.00, 0.15], // G4
                [392.00, 0.15], // G4
                [392.00, 0.15], // G4
                [523.25, 0.6],  // C5 - heroic
                [783.99, 0.6],  // G5
                [698.46, 0.15], // F5
                [659.25, 0.15], // E5
                [587.33, 0.15], // D5
                [1046.50, 0.6], // C6 - high
                [783.99, 0.4],  // G5
                [698.46, 0.15], // F5
                [659.25, 0.15], // E5
                [587.33, 0.15], // D5
                [1046.50, 0.6], // C6
                [783.99, 0.4],  // G5
                [698.46, 0.15], // F5
                [659.25, 0.15], // E5
                [698.46, 0.15], // F5
                [587.33, 0.8],  // D5
            ];

            // Powerful bass line
            const bassLine = [
                [130.81, 0.4], // C3
                [0, 0.1],
                [130.81, 0.4], // C3
                [0, 0.1],
                [130.81, 0.4], // C3
                [196.00, 0.8], // G3
                [130.81, 0.8], // C3
                [146.83, 0.4], // D3
                [0, 0.1],
                [146.83, 0.4], // D3
                [196.00, 0.8], // G3
                [130.81, 0.8], // C3
                [146.83, 0.4], // D3
                [0, 0.1],
                [146.83, 0.4], // D3
                [110.00, 0.8], // A2
                [146.83, 0.8], // D3
            ];

            // Chord progression for epic feel
            const chords = [
                [[261.63, 329.63, 392.00], 1.2], // C major
                [[293.66, 369.99, 440.00], 1.2], // D minor
                [[196.00, 246.94, 293.66], 1.2], // G major
                [[261.63, 329.63, 392.00], 1.2], // C major
                [[220.00, 277.18, 329.63], 1.2], // A minor
                [[246.94, 311.13, 369.99], 1.2], // B dim
                [[261.63, 329.63, 392.00], 1.6], // C major
            ];

            function scheduleLoop() {
                const now = audioContext.currentTime;
                let time = now;

                // Schedule epic melody
                melody.forEach(([freq, duration]) => {
                    if (freq > 0) {
                        playNote(freq, time, duration, 'square', 0.12);
                        playNote(freq * 2, time, duration, 'sine', 0.04); // Harmonic
                    }
                    time += duration;
                });

                // Schedule bass
                let bassTime = now;
                bassLine.forEach(([freq, duration]) => {
                    if (freq > 0) {
                        playBassNote(freq, bassTime, duration);
                    }
                    bassTime += duration;
                });

                // Schedule chords
                let chordTime = now;
                chords.forEach(([freqs, duration]) => {
                    playChord(freqs, chordTime, duration);
                    chordTime += duration;
                });

                const loopDuration = melody.reduce((sum, [_, dur]) => sum + dur, 0);
                setTimeout(scheduleLoop, loopDuration * 1000 - 100);
            }

            scheduleLoop();
        }

        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        }

        function drawBlock(x, y, colorIndex, context = ctx, blockSize = BLOCK_SIZE) {
            context.fillStyle = COLORS[colorIndex];
            context.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);
            context.strokeStyle = '#003300';
            context.lineWidth = 2;
            context.strokeRect(x * blockSize, y * blockSize, blockSize, blockSize);
        }

        function drawBoard() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(x, y, board[y][x]);
                    }
                }
            }

            if (currentPiece) {
                for (let y = 0; y < currentPiece.shape.length; y++) {
                    for (let x = 0; x < currentPiece.shape[y].length; x++) {
                        if (currentPiece.shape[y][x]) {
                            drawBlock(currentX + x, currentY + y, currentPiece.color);
                        }
                    }
                }
            }
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (nextPiece) {
                const blockSize = 20;
                const offsetX = (nextCanvas.width - nextPiece.shape[0].length * blockSize) / 2 / blockSize;
                const offsetY = (nextCanvas.height - nextPiece.shape.length * blockSize) / 2 / blockSize;

                for (let y = 0; y < nextPiece.shape.length; y++) {
                    for (let x = 0; x < nextPiece.shape[y].length; x++) {
                        if (nextPiece.shape[y][x]) {
                            drawBlock(offsetX + x, offsetY + y, nextPiece.color, nextCtx, blockSize);
                        }
                    }
                }
            }
        }

        function generatePiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            return {
                shape: SHAPES[shapeIndex],
                color: shapeIndex + 1
            };
        }

        function newPiece() {
            if (!nextPiece) {
                nextPiece = generatePiece();
            }

            currentPiece = nextPiece;
            nextPiece = generatePiece();

            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;

            drawNextPiece();

            if (collision()) {
                gameOver();
            }
        }

        function collision() {
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        const newX = currentX + x;
                        const newY = currentY + y;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }

                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge() {
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        const boardY = currentY + y;
                        const boardX = currentX + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
        }

        function rotate() {
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );
            const previousShape = currentPiece.shape;
            currentPiece.shape = rotated;

            if (collision()) {
                currentPiece.shape = previousShape;
            }
        }

        function moveLeft() {
            currentX--;
            if (collision()) {
                currentX++;
            }
        }

        function moveRight() {
            currentX++;
            if (collision()) {
                currentX--;
            }
        }

        function moveDown() {
            currentY++;
            if (collision()) {
                currentY--;
                merge();
                clearLines();
                newPiece();
            } else {
                dropCounter = 0;
            }
        }

        function hardDrop() {
            while (!collision()) {
                currentY++;
            }
            currentY--;
            merge();
            clearLines();
            newPiece();
            dropCounter = 0;
        }

        function clearLines() {
            let linesCleared = 0;

            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }

            if (linesCleared > 0) {
                lines += linesCleared;
                score += [40, 100, 300, 1200][linesCleared - 1] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);

                document.getElementById('score').textContent = score;
                document.getElementById('lines').textContent = lines;
                document.getElementById('level').textContent = level;
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            initBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            gameRunning = true;
            nextPiece = null;

            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;
            document.getElementById('game-over').style.display = 'none';

            newPiece();
        }

        function update(time = 0) {
            if (gameRunning) {
                const deltaTime = time - lastTime;
                lastTime = time;
                dropCounter += deltaTime;

                if (dropCounter > dropInterval) {
                    moveDown();
                }

                drawBoard();
            }

            requestAnimationFrame(update);
        }

        function startGameWithMusic() {
            initAudio();
            startMusic();
        }

        // Touch controls with preventDefault to ensure DOWN works
        document.getElementById('rotate').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startGameWithMusic();
            if (gameRunning) rotate();
        });

        document.getElementById('left').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startGameWithMusic();
            if (gameRunning) moveLeft();
        });

        document.getElementById('right').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startGameWithMusic();
            if (gameRunning) moveRight();
        });

        document.getElementById('down').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            startGameWithMusic();
            if (gameRunning) {
                moveDown();
            }
        });

        document.getElementById('restart').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            restartGame();
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            startGameWithMusic();
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    moveLeft();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveRight();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveDown();
                    break;
                case 'ArrowUp':
                case ' ':
                    e.preventDefault();
                    rotate();
                    break;
            }
        });

        // Start music on first interaction (not on DOWN button to avoid conflict)
        canvas.addEventListener('pointerdown', startGameWithMusic, { once: true });

        // Initialize game
        initBoard();
        newPiece();
        update();
    </script>
</body>
</html>
