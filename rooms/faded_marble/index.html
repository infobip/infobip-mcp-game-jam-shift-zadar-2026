<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>8-Bit Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 100%;
            padding: 10px;
        }

        #score-panel {
            text-align: center;
            font-size: 16px;
            text-shadow: 0 0 10px #00ff00;
        }

        #score-panel h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        #canvas {
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            background: #000;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
            touch-action: none;
        }

        .btn {
            background: #003300;
            border: 3px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            padding: 20px;
            min-height: 60px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .btn:active {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        #rotate {
            grid-column: 2;
        }

        #left {
            grid-column: 1;
            grid-row: 2;
        }

        #down {
            grid-column: 2;
            grid-row: 2;
        }

        #right {
            grid-column: 3;
            grid-row: 2;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 4px solid #00ff00;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
            z-index: 1000;
        }

        #game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        #restart {
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-panel">
            <h1>8-BIT TETRIS</h1>
            <div>SCORE: <span id="score">0</span></div>
            <div>LINES: <span id="lines">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
        </div>

        <canvas id="canvas" width="300" height="630"></canvas>

        <div id="controls">
            <button class="btn" id="rotate">ROTATE</button>
            <button class="btn" id="left">LEFT</button>
            <button class="btn" id="down">DOWN</button>
            <button class="btn" id="right">RIGHT</button>
        </div>
    </div>

    <div id="game-over">
        <h2>GAME OVER</h2>
        <div>FINAL SCORE: <span id="final-score">0</span></div>
        <button class="btn" id="restart">RESTART</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const COLS = 10;
        const ROWS = 21;
        const BLOCK_SIZE = 30;

        // 8-bit color palette
        const COLORS = [
            '#000000', // empty
            '#ff0000', // I
            '#00ff00', // O
            '#0000ff', // T
            '#ffff00', // S
            '#ff00ff', // Z
            '#00ffff', // J
            '#ff8800'  // L
        ];

        // Tetromino shapes
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]], // Z
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]]  // L
        ];

        let board = [];
        let score = 0;
        let lines = 0;
        let level = 1;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let gameRunning = true;

        let currentPiece = null;
        let currentX = 0;
        let currentY = 0;

        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        }

        function drawBlock(x, y, colorIndex) {
            ctx.fillStyle = COLORS[colorIndex];
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = '#003300';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawBoard() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(x, y, board[y][x]);
                    }
                }
            }

            if (currentPiece) {
                for (let y = 0; y < currentPiece.shape.length; y++) {
                    for (let x = 0; x < currentPiece.shape[y].length; x++) {
                        if (currentPiece.shape[y][x]) {
                            drawBlock(currentX + x, currentY + y, currentPiece.color);
                        }
                    }
                }
            }
        }

        function newPiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            currentPiece = {
                shape: SHAPES[shapeIndex],
                color: shapeIndex + 1
            };
            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;

            if (collision()) {
                gameOver();
            }
        }

        function collision() {
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        const newX = currentX + x;
                        const newY = currentY + y;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }

                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge() {
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        const boardY = currentY + y;
                        const boardX = currentX + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
        }

        function rotate() {
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );
            const previousShape = currentPiece.shape;
            currentPiece.shape = rotated;

            if (collision()) {
                currentPiece.shape = previousShape;
            }
        }

        function moveLeft() {
            currentX--;
            if (collision()) {
                currentX++;
            }
        }

        function moveRight() {
            currentX++;
            if (collision()) {
                currentX--;
            }
        }

        function moveDown() {
            currentY++;
            if (collision()) {
                currentY--;
                merge();
                clearLines();
                newPiece();
            }
            dropCounter = 0;
        }

        function hardDrop() {
            while (!collision()) {
                currentY++;
            }
            currentY--;
            merge();
            clearLines();
            newPiece();
            dropCounter = 0;
        }

        function clearLines() {
            let linesCleared = 0;

            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }

            if (linesCleared > 0) {
                lines += linesCleared;
                score += [40, 100, 300, 1200][linesCleared - 1] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);

                document.getElementById('score').textContent = score;
                document.getElementById('lines').textContent = lines;
                document.getElementById('level').textContent = level;
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            initBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            gameRunning = true;

            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;
            document.getElementById('game-over').style.display = 'none';

            newPiece();
        }

        function update(time = 0) {
            if (gameRunning) {
                const deltaTime = time - lastTime;
                lastTime = time;
                dropCounter += deltaTime;

                if (dropCounter > dropInterval) {
                    moveDown();
                }

                drawBoard();
            }

            requestAnimationFrame(update);
        }

        // Touch controls
        document.getElementById('rotate').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameRunning) rotate();
        });

        document.getElementById('left').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameRunning) moveLeft();
        });

        document.getElementById('right').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameRunning) moveRight();
        });

        document.getElementById('down').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameRunning) moveDown();
        });

        document.getElementById('restart').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            restartGame();
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    moveLeft();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveRight();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveDown();
                    break;
                case 'ArrowUp':
                case ' ':
                    e.preventDefault();
                    rotate();
                    break;
            }
        });

        // Initialize game
        initBoard();
        newPiece();
        update();
    </script>
</body>
</html>
