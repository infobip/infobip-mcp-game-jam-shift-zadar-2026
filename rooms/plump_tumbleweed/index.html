<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Rail Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            cursor: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #1a0f1e;
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(180deg, #4a3a5e 0%, #2a1a3e 50%, #1a0f1e 100%);
        }

        .env-object {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            font-size: 60px;
        }

        .wall-section {
            position: absolute;
            background: linear-gradient(90deg, #3a2a4e 0%, #2a1a3e 50%, #3a2a4e 100%);
            border: 3px solid #1a0a2e;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .window {
            position: absolute;
            background: linear-gradient(135deg, #1a3a5e 0%, #0a1a3e 100%);
            border: 4px solid #2a2a4e;
            box-shadow: inset 0 0 20px rgba(100, 150, 200, 0.3);
            pointer-events: none;
        }

        .floor-tile {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: repeating-linear-gradient(
                0deg,
                #2a1a3e 0px,
                #2a1a3e 10px,
                #1a0a2e 10px,
                #1a0a2e 20px
            );
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
            transform-origin: bottom center;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
            border: 2px solid #ff3333;
        }

        #health-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ff3333;
            border-radius: 5px;
            overflow: hidden;
            z-index: 100;
            pointer-events: none;
        }

        #health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3333 0%, #ff6666 100%);
            transition: width 0.3s;
        }

        #game-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none;
            cursor: none;
            z-index: 10;
        }

        #crosshair {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 90;
            transform: translate(-50%, -50%);
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: #ff3333;
            box-shadow: 0 0 10px #ff3333;
        }

        #crosshair::before {
            width: 30px;
            height: 3px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #crosshair::after {
            width: 3px;
            height: 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff3333;
            opacity: 0.8;
        }

        .enemy {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 100%);
            border-radius: 10px;
            cursor: crosshair;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8),
                        inset 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(0);
            animation: enemy-appear 0.3s ease-out forwards;
            z-index: 20;
        }

        @keyframes enemy-appear {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        .enemy.attacking {
            animation: enemy-attack 0.5s ease-in-out infinite;
        }

        @keyframes enemy-attack {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .explosion {
            position: absolute;
            pointer-events: none;
            font-size: 60px;
            animation: explode 0.6s ease-out forwards;
            z-index: 50;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: scale(3) rotate(360deg);
            }
        }

        .hit-effect {
            position: absolute;
            pointer-events: none;
            font-size: 28px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
            animation: score-pop 0.8s ease-out forwards;
            z-index: 60;
        }

        @keyframes score-pop {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.5);
            }
        }

        .bullet-hole {
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, #000 30%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            z-index: 15;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
        }

        #game-over-screen {
            display: none;
        }

        #start-screen h1, #game-over-screen h1 {
            font-size: 48px;
            color: #ff3333;
            margin-bottom: 20px;
            text-shadow: 0 0 30px #ff3333;
            text-align: center;
        }

        #start-screen p {
            font-size: 18px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.8;
        }

        .stats {
            font-size: 24px;
            color: #ff3333;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }

        .game-btn {
            padding: 18px 50px;
            font-size: 26px;
            background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.8);
            touch-action: manipulation;
            min-width: 220px;
            min-height: 70px;
            text-transform: uppercase;
        }

        .game-btn:active {
            transform: scale(0.95);
        }

        .muzzle-flash {
            position: absolute;
            pointer-events: none;
            font-size: 40px;
            animation: flash 0.1s ease-out forwards;
            z-index: 85;
        }

        @keyframes flash {
            0% {
                opacity: 1;
                transform: scale(0.3);
            }
            100% {
                opacity: 0;
                transform: scale(2);
            }
        }

        .damage-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(255, 0, 0, 0.5) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 95;
            animation: damage-flash 0.3s ease-out;
        }

        @keyframes damage-flash {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background-layer">
            <div class="floor-tile"></div>
        </div>

        <div id="hud">
            <div class="hud-item">SCORE: <span id="score">0</span></div>
            <div class="hud-item">WAVE: <span id="wave">1</span></div>
        </div>

        <div id="health-bar">
            <div id="health-fill"></div>
        </div>

        <div id="game-area">
            <div id="crosshair">
                <div class="crosshair-ring"></div>
            </div>
        </div>

        <div id="start-screen">
            <h1>🎯 CRISIS ZONE 🎯</h1>
            <p>Classic arcade rail shooter!<br><br>You're moving through enemy territory<br>Tap to aim and shoot enemies<br>Don't let them attack you!</p>
            <button class="game-btn" id="start-btn">Start Game</button>
        </div>

        <div id="game-over-screen">
            <h1>💀 MISSION FAILED 💀</h1>
            <div class="stats">
                <div>Final Score: <span id="final-score">0</span></div>
                <div>Wave Reached: <span id="final-wave">1</span></div>
                <div>Enemies Eliminated: <span id="final-kills">0</span></div>
            </div>
            <button class="game-btn" id="retry-btn">Retry Mission</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const gameArea = document.getElementById('game-area');
        const backgroundLayer = document.getElementById('background-layer');
        const crosshair = document.getElementById('crosshair');
        const scoreDisplay = document.getElementById('score');
        const waveDisplay = document.getElementById('wave');
        const healthFill = document.getElementById('health-fill');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');

        let score = 0;
        let wave = 1;
        let kills = 0;
        let health = 100;
        let gameActive = false;
        let enemySpawnInterval;
        let environmentInterval;
        let currentMouseX = window.innerWidth / 2;
        let currentMouseY = window.innerHeight / 2;
        let scrollSpeed = 2;

        // Update crosshair position
        gameArea.addEventListener('pointermove', (e) => {
            e.preventDefault();
            currentMouseX = e.clientX;
            currentMouseY = e.clientY;
            crosshair.style.left = currentMouseX + 'px';
            crosshair.style.top = currentMouseY + 'px';
        });

        gameArea.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            e.preventDefault();

            const tapX = e.clientX;
            const tapY = e.clientY;

            // Check if hit enemy
            const target = e.target;
            if (target.classList.contains('enemy')) {
                shootEnemy(target, tapX, tapY);
            } else {
                // Missed shot - show bullet hole
                createBulletHole(tapX, tapY);
            }

            // Muzzle flash at crosshair
            createMuzzleFlash(tapX, tapY);
        });

        function createMuzzleFlash(x, y) {
            const flash = document.createElement('div');
            flash.className = 'muzzle-flash';
            flash.textContent = '💥';
            flash.style.left = x + 'px';
            flash.style.top = y + 'px';
            gameArea.appendChild(flash);
            setTimeout(() => flash.remove(), 100);
        }

        function createBulletHole(x, y) {
            const hole = document.createElement('div');
            hole.className = 'bullet-hole';
            hole.style.left = x + 'px';
            hole.style.top = y + 'px';
            gameArea.appendChild(hole);
            setTimeout(() => hole.remove(), 3000);
        }

        function createEnvironmentObject() {
            if (!gameActive) return;

            const type = Math.random();

            if (type < 0.4) {
                // Wall section
                const wall = document.createElement('div');
                wall.className = 'wall-section';
                wall.style.width = (80 + Math.random() * 120) + 'px';
                wall.style.height = (150 + Math.random() * 200) + 'px';
                wall.style.left = (Math.random() > 0.5 ? -100 : window.innerWidth + 100) + 'px';
                wall.style.top = (window.innerHeight * 0.2 + Math.random() * window.innerHeight * 0.3) + 'px';
                wall.style.zIndex = '2';
                backgroundLayer.appendChild(wall);

                let position = parseFloat(wall.style.left);
                const targetX = window.innerWidth / 2 + (Math.random() - 0.5) * 300;
                const animSpeed = 3 + Math.random() * 2;

                function animateWall() {
                    if (!gameActive) {
                        wall.remove();
                        return;
                    }

                    position += (position < targetX) ? animSpeed : -animSpeed;
                    wall.style.left = position + 'px';

                    const currentTop = parseFloat(wall.style.top);
                    wall.style.top = (currentTop + scrollSpeed) + 'px';

                    if (currentTop > window.innerHeight) {
                        wall.remove();
                        return;
                    }

                    requestAnimationFrame(animateWall);
                }
                requestAnimationFrame(animateWall);

            } else if (type < 0.7) {
                // Window
                const win = document.createElement('div');
                win.className = 'window';
                win.style.width = (60 + Math.random() * 80) + 'px';
                win.style.height = (80 + Math.random() * 100) + 'px';
                win.style.left = (Math.random() * (window.innerWidth - 150)) + 'px';
                win.style.top = '-150px';
                win.style.zIndex = '2';
                backgroundLayer.appendChild(win);

                let topPos = -150;
                function animateWindow() {
                    if (!gameActive) {
                        win.remove();
                        return;
                    }

                    topPos += scrollSpeed * 1.5;
                    win.style.top = topPos + 'px';

                    if (topPos > window.innerHeight) {
                        win.remove();
                        return;
                    }

                    requestAnimationFrame(animateWindow);
                }
                requestAnimationFrame(animateWindow);

            } else {
                // Environmental object
                const objects = ['🚪', '📦', '🪟', '🗑️', '🛢️'];
                const obj = document.createElement('div');
                obj.className = 'env-object';
                obj.textContent = objects[Math.floor(Math.random() * objects.length)];
                obj.style.left = (Math.random() * (window.innerWidth - 100)) + 'px';
                obj.style.top = '-100px';
                obj.style.zIndex = '3';
                backgroundLayer.appendChild(obj);

                let topPos = -100;
                function animateObject() {
                    if (!gameActive) {
                        obj.remove();
                        return;
                    }

                    topPos += scrollSpeed * 2;
                    obj.style.top = topPos + 'px';

                    if (topPos > window.innerHeight) {
                        obj.remove();
                        return;
                    }

                    requestAnimationFrame(animateObject);
                }
                requestAnimationFrame(animateObject);
            }
        }

        function shootEnemy(enemy, x, y) {
            if (enemy.dataset.destroyed) return;
            enemy.dataset.destroyed = 'true';

            score += 100;
            kills++;
            scoreDisplay.textContent = score;

            // Explosion
            const rect = enemy.getBoundingClientRect();
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.textContent = '💥';
            explosion.style.left = rect.left + rect.width / 2 + 'px';
            explosion.style.top = rect.top + rect.height / 2 + 'px';
            explosion.style.transform = 'translate(-50%, -50%)';
            gameArea.appendChild(explosion);
            setTimeout(() => explosion.remove(), 600);

            // Score popup
            const hitEffect = document.createElement('div');
            hitEffect.className = 'hit-effect';
            hitEffect.textContent = '+100';
            hitEffect.style.left = rect.left + rect.width / 2 + 'px';
            hitEffect.style.top = rect.top + 'px';
            hitEffect.style.transform = 'translateX(-50%)';
            gameArea.appendChild(hitEffect);
            setTimeout(() => hitEffect.remove(), 800);

            enemy.remove();
        }

        function createEnemy() {
            if (!gameActive) return;

            const enemy = document.createElement('div');
            enemy.className = 'enemy';

            // Random enemy types
            const types = ['👹', '👺', '🤖', '👻', '💀', '🧟'];
            enemy.textContent = types[Math.floor(Math.random() * types.length)];

            // Spawn along the path - left, right, or center
            const lanes = [
                window.innerWidth * 0.2,
                window.innerWidth * 0.5,
                window.innerWidth * 0.8
            ];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];

            enemy.style.left = (lane + (Math.random() - 0.5) * 100) + 'px';
            enemy.style.top = (100 + Math.random() * 200) + 'px';
            enemy.style.zIndex = '20';

            gameArea.appendChild(enemy);

            // Enemy lifetime - starts attacking after a delay
            const attackDelay = Math.max(2500 - (wave * 100), 1000);

            setTimeout(() => {
                if (!enemy.dataset.destroyed && gameActive) {
                    enemy.classList.add('attacking');

                    // Attack after animation
                    setTimeout(() => {
                        if (!enemy.dataset.destroyed && gameActive) {
                            enemyAttack(enemy);
                        }
                    }, 1500);
                }
            }, attackDelay);

            // Auto-remove if not killed
            setTimeout(() => {
                if (!enemy.dataset.destroyed) {
                    enemy.remove();
                }
            }, attackDelay + 2000);
        }

        function enemyAttack(enemy) {
            if (!gameActive) return;

            health -= 20;
            healthFill.style.width = health + '%';

            // Damage vignette effect
            const vignette = document.createElement('div');
            vignette.className = 'damage-vignette';
            gameContainer.appendChild(vignette);
            setTimeout(() => vignette.remove(), 300);

            // Remove enemy after attack
            enemy.remove();

            if (health <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            clearInterval(enemySpawnInterval);
            clearInterval(environmentInterval);

            document.getElementById('final-score').textContent = score;
            document.getElementById('final-wave').textContent = wave;
            document.getElementById('final-kills').textContent = kills;
            gameOverScreen.style.display = 'flex';

            // Clear all enemies
            document.querySelectorAll('.enemy').forEach(e => e.remove());
        }

        function nextWave() {
            wave++;
            waveDisplay.textContent = wave;
            scrollSpeed = Math.min(2 + (wave * 0.2), 5);
        }

        function startGame() {
            gameActive = true;
            score = 0;
            wave = 1;
            kills = 0;
            health = 100;
            scrollSpeed = 2;

            scoreDisplay.textContent = score;
            waveDisplay.textContent = wave;
            healthFill.style.width = '100%';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            // Position crosshair
            crosshair.style.left = window.innerWidth / 2 + 'px';
            crosshair.style.top = window.innerHeight / 2 + 'px';

            document.querySelectorAll('.enemy, .bullet-hole, .env-object, .wall-section, .window').forEach(e => e.remove());

            // Spawn environment continuously
            environmentInterval = setInterval(() => {
                createEnvironmentObject();
            }, 800);

            // Spawn enemies in waves
            let enemiesThisWave = 0;
            const enemiesPerWave = 5 + wave;

            enemySpawnInterval = setInterval(() => {
                if (!gameActive) return;

                createEnemy();
                enemiesThisWave++;

                if (enemiesThisWave >= enemiesPerWave) {
                    enemiesThisWave = 0;
                    nextWave();
                }
            }, Math.max(1500 - (wave * 50), 600));
        }

        startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        retryBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        // Initialize crosshair
        crosshair.style.left = window.innerWidth / 2 + 'px';
        crosshair.style.top = window.innerHeight / 2 + 'px';
    </script>
</body>
</html>
