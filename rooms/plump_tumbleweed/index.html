<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Rail Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            border: 2px solid #00ff88;
        }

        #game-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            perspective: 1000px;
            touch-action: none;
        }

        #hero {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 70;
            filter: drop-shadow(0 0 10px #00ff88);
        }

        .enemy {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff0844 0%, #ff6b6b 100%);
            border-radius: 10px;
            cursor: pointer;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(255, 8, 68, 0.6),
                        inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: transform 0.1s;
        }

        .enemy:active {
            transform: scale(0.9);
        }

        .explosion {
            position: absolute;
            pointer-events: none;
            font-size: 48px;
            animation: explode 0.5s ease-out forwards;
            z-index: 50;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: scale(3) rotate(180deg);
            }
        }

        .hit-effect {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            animation: score-pop 0.6s ease-out forwards;
            z-index: 60;
        }

        @keyframes score-pop {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px) scale(1.3);
            }
        }

        .bullet {
            position: absolute;
            width: 6px;
            height: 20px;
            background: linear-gradient(180deg, #00ff88 0%, #00d9ff 100%);
            border-radius: 3px;
            pointer-events: none;
            box-shadow: 0 0 10px #00ff88;
            z-index: 60;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
        }

        #start-screen h1 {
            font-size: 42px;
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff88;
        }

        #start-screen p {
            font-size: 18px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
        }

        #start-btn {
            padding: 16px 48px;
            font-size: 24px;
            background: linear-gradient(135deg, #00ff88 0%, #00d9ff 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            touch-action: manipulation;
            min-width: 200px;
            min-height: 60px;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .muzzle-flash {
            position: absolute;
            pointer-events: none;
            font-size: 30px;
            animation: flash 0.15s ease-out forwards;
            z-index: 80;
        }

        @keyframes flash {
            0% {
                opacity: 1;
                transform: scale(0.5);
            }
            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">SCORE: <span id="score">0</span></div>
            <div class="hud-item">WAVE: <span id="wave">1</span></div>
            <div class="hud-item">KILLS: <span id="kills">0</span></div>
        </div>

        <div id="game-area">
            <div id="hero">🚀</div>
        </div>

        <div id="start-screen">
            <h1>⚡ RAIL SHOOTER ⚡</h1>
            <p>Drag to move your ship<br>Tap anywhere to shoot!<br>Destroy the alien invaders!</p>
            <button id="start-btn">START MISSION</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const gameArea = document.getElementById('game-area');
        const hero = document.getElementById('hero');
        const scoreDisplay = document.getElementById('score');
        const waveDisplay = document.getElementById('wave');
        const killsDisplay = document.getElementById('kills');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let wave = 1;
        let kills = 0;
        let gameActive = false;
        let enemySpawnInterval;
        let waveEnemiesRemaining = 0;

        // Hero movement
        let heroX = window.innerWidth / 2;
        let heroY = window.innerHeight - 80;
        let heroVelX = 0;
        let heroVelY = 0;
        let targetX = heroX;
        let targetY = heroY;
        let isDragging = false;

        const ACCELERATION = 0.8;
        const FRICTION = 0.85;
        const MAX_SPEED = 15;

        function updateHeroPosition() {
            if (!gameActive) return;

            // Calculate distance to target
            const dx = targetX - heroX;
            const dy = targetY - heroY;

            // Apply acceleration towards target
            heroVelX += dx * ACCELERATION * 0.01;
            heroVelY += dy * ACCELERATION * 0.01;

            // Apply friction
            heroVelX *= FRICTION;
            heroVelY *= FRICTION;

            // Limit speed
            const speed = Math.sqrt(heroVelX * heroVelX + heroVelY * heroVelY);
            if (speed > MAX_SPEED) {
                heroVelX = (heroVelX / speed) * MAX_SPEED;
                heroVelY = (heroVelY / speed) * MAX_SPEED;
            }

            // Update position
            heroX += heroVelX;
            heroY += heroVelY;

            // Keep hero in bounds
            const margin = 25;
            heroX = Math.max(margin, Math.min(window.innerWidth - margin, heroX));
            heroY = Math.max(80, Math.min(window.innerHeight - margin, heroY));

            // Update DOM
            hero.style.left = heroX + 'px';
            hero.style.bottom = (window.innerHeight - heroY) + 'px';
            hero.style.transform = 'translateX(-50%)';

            requestAnimationFrame(updateHeroPosition);
        }

        // Touch/pointer handling
        gameArea.addEventListener('pointermove', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            targetX = e.clientX;
            targetY = e.clientY;
            isDragging = true;
        });

        gameArea.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            e.preventDefault();

            targetX = e.clientX;
            targetY = e.clientY;
            isDragging = true;

            // Check if tapped on enemy
            const target = e.target;
            if (target.classList.contains('enemy')) {
                return; // Enemy click handler will handle this
            }

            // Otherwise shoot
            shootBullet();
        });

        gameArea.addEventListener('pointerup', (e) => {
            isDragging = false;
        });

        function shootBullet() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = heroX + 'px';
            bullet.style.bottom = (window.innerHeight - heroY + 25) + 'px';
            bullet.style.transform = 'translateX(-50%)';
            gameArea.appendChild(bullet);

            // Muzzle flash
            const flash = document.createElement('div');
            flash.className = 'muzzle-flash';
            flash.textContent = '💥';
            flash.style.left = heroX + 'px';
            flash.style.bottom = (window.innerHeight - heroY + 20) + 'px';
            flash.style.transform = 'translateX(-50%)';
            gameArea.appendChild(flash);
            setTimeout(() => flash.remove(), 150);

            let bulletY = heroY + 25;
            const bulletSpeed = 12;
            let animFrame;

            function moveBullet() {
                if (!gameActive) {
                    bullet.remove();
                    return;
                }

                bulletY += bulletSpeed;
                bullet.style.bottom = (window.innerHeight - bulletY) + 'px';

                // Check collision with enemies
                const enemies = document.querySelectorAll('.enemy');
                const bulletRect = bullet.getBoundingClientRect();

                enemies.forEach(enemy => {
                    if (enemy.dataset.destroyed) return;

                    const enemyRect = enemy.getBoundingClientRect();
                    if (rectsIntersect(bulletRect, enemyRect)) {
                        destroyEnemy(enemy);
                        bullet.remove();
                        cancelAnimationFrame(animFrame);
                    }
                });

                if (bulletY > window.innerHeight) {
                    bullet.remove();
                    cancelAnimationFrame(animFrame);
                    return;
                }

                animFrame = requestAnimationFrame(moveBullet);
            }

            animFrame = requestAnimationFrame(moveBullet);
        }

        function rectsIntersect(r1, r2) {
            return !(r2.left > r1.right ||
                     r2.right < r1.left ||
                     r2.top > r1.bottom ||
                     r2.bottom < r1.top);
        }

        function destroyEnemy(enemy) {
            if (enemy.dataset.destroyed) return;
            enemy.dataset.destroyed = 'true';

            score += 50;
            kills++;
            scoreDisplay.textContent = score;
            killsDisplay.textContent = kills;

            // Explosion
            const rect = enemy.getBoundingClientRect();
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.textContent = '💥';
            explosion.style.left = rect.left + rect.width / 2 + 'px';
            explosion.style.top = rect.top + 'px';
            explosion.style.transform = 'translateX(-50%)';
            gameArea.appendChild(explosion);
            setTimeout(() => explosion.remove(), 500);

            // Score popup
            const hitEffect = document.createElement('div');
            hitEffect.className = 'hit-effect';
            hitEffect.textContent = '+50';
            hitEffect.style.left = rect.left + rect.width / 2 + 'px';
            hitEffect.style.top = rect.top + 'px';
            hitEffect.style.transform = 'translateX(-50%)';
            gameArea.appendChild(hitEffect);
            setTimeout(() => hitEffect.remove(), 600);

            enemy.remove();

            waveEnemiesRemaining--;
            if (waveEnemiesRemaining <= 0) {
                nextWave();
            }
        }

        function createEnemy() {
            if (!gameActive) return;

            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.textContent = '👾';

            const startX = Math.random() * (window.innerWidth - 60) + 30;
            enemy.style.left = startX + 'px';
            enemy.style.top = '-80px';

            gameArea.appendChild(enemy);

            const duration = Math.max(3000 - (wave * 100), 1500);
            const targetY = window.innerHeight + 80;

            let startTime = Date.now();
            let animationFrame;

            function animate() {
                if (!gameActive || enemy.dataset.destroyed) {
                    if (!enemy.dataset.destroyed) enemy.remove();
                    return;
                }

                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;

                if (progress >= 1) {
                    enemy.remove();
                    return;
                }

                const currentY = -80 + (targetY * progress);
                enemy.style.top = currentY + 'px';

                animationFrame = requestAnimationFrame(animate);
            }

            animationFrame = requestAnimationFrame(animate);

            // Allow tapping enemies directly too
            enemy.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!gameActive || enemy.dataset.destroyed) return;
                destroyEnemy(enemy);
                cancelAnimationFrame(animationFrame);
            });
        }

        function nextWave() {
            wave++;
            waveDisplay.textContent = wave;
            waveEnemiesRemaining = 5 + (wave * 2);
        }

        function startGame() {
            gameActive = true;
            score = 0;
            wave = 1;
            kills = 0;
            waveEnemiesRemaining = 5;

            scoreDisplay.textContent = score;
            waveDisplay.textContent = wave;
            killsDisplay.textContent = kills;
            startScreen.style.display = 'none';

            // Reset hero position
            heroX = window.innerWidth / 2;
            heroY = window.innerHeight - 80;
            targetX = heroX;
            targetY = heroY;
            heroVelX = 0;
            heroVelY = 0;

            document.querySelectorAll('.enemy, .bullet').forEach(e => e.remove());

            updateHeroPosition();

            const baseSpawnRate = 1200;
            enemySpawnInterval = setInterval(() => {
                if (waveEnemiesRemaining > 0) {
                    createEnemy();
                }
            }, Math.max(baseSpawnRate - (wave * 50), 400));
        }

        startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });
    </script>
</body>
</html>
