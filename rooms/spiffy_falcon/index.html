<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bubble Pop!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        #game-header {
            padding: 20px;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
        }

        #timer {
            font-size: 20px;
        }

        #game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.2),
                        inset 10px 10px 20px rgba(255, 255, 255, 0.3),
                        0 5px 15px rgba(0, 0, 0, 0.3);
            touch-action: none;
            animation: float-up linear forwards;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-120dvh) scale(1.2);
                opacity: 0;
            }
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 30%;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
        }

        .pop-effect {
            position: absolute;
            color: white;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: pop-fade 0.6s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes pop-fade {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
        }

        #game-over h2 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 20px;
        }

        #final-score {
            font-size: 48px;
            color: #764ba2;
            margin: 20px 0;
            font-weight: bold;
        }

        #restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 56px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-header">
        <div id="score">Score: <span id="score-value">0</span></div>
        <div id="timer">Time: <span id="time-value">30</span>s</div>
    </div>

    <div id="game-container"></div>

    <div id="game-over">
        <h2>Game Over!</h2>
        <div id="final-score">0</div>
        <p style="font-size: 18px; color: #666; margin-bottom: 10px;">Bubbles Popped!</p>
        <button id="restart-btn">Play Again</button>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreValue = document.getElementById('score-value');
        const timeValue = document.getElementById('time-value');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let bubbleInterval;
        let timerInterval;

        const colors = [
            '#ff6b6b', '#4ecdc4', '#45b7d1', '#ffd93d',
            '#6bcf7f', '#ff8ed4', '#a29bfe', '#fd79a8'
        ];

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createBubble() {
            if (!gameActive) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const size = 60 + Math.random() * 60;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';

            const maxX = window.innerWidth - size;
            bubble.style.left = Math.random() * maxX + 'px';
            bubble.style.bottom = '-100px';

            bubble.style.background = getRandomColor();

            const duration = 3 + Math.random() * 3;
            bubble.style.animationDuration = duration + 's';

            bubble.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (!gameActive) return;

                popBubble(bubble, e.clientX, e.clientY);
            });

            gameContainer.appendChild(bubble);

            setTimeout(() => {
                if (bubble.parentNode) {
                    bubble.remove();
                }
            }, duration * 1000);
        }

        function popBubble(bubble, x, y) {
            score++;
            scoreValue.textContent = score;

            const popEffect = document.createElement('div');
            popEffect.className = 'pop-effect';
            popEffect.textContent = '+1';
            popEffect.style.left = x + 'px';
            popEffect.style.top = y + 'px';

            gameContainer.appendChild(popEffect);

            bubble.remove();

            setTimeout(() => {
                popEffect.remove();
            }, 600);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;

            scoreValue.textContent = '0';
            timeValue.textContent = '30';
            gameOverScreen.style.display = 'none';

            gameContainer.innerHTML = '';

            bubbleInterval = setInterval(() => {
                createBubble();
            }, 600);

            timerInterval = setInterval(() => {
                timeLeft--;
                timeValue.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(bubbleInterval);
            clearInterval(timerInterval);

            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'block';

            const bubbles = gameContainer.querySelectorAll('.bubble');
            bubbles.forEach(bubble => bubble.remove());
        }

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        startGame();
    </script>
</body>
</html>
