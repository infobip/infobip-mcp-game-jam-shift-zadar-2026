<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Tower Defense</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #2c3e50;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        #game-header {
            padding: 12px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.8;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }

        #game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #34495e;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #tower-menu {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .tower-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: 2px solid #2980b9;
            border-radius: 10px;
            padding: 10px;
            min-width: 80px;
            min-height: 60px;
            font-size: 16px;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tower-btn.selected {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: #c0392b;
        }

        .tower-btn:active {
            transform: scale(0.95);
        }

        .tower-cost {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.9;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            z-index: 100;
        }

        #game-over h2 {
            color: #e74c3c;
            font-size: 28px;
            margin-bottom: 15px;
        }

        #final-wave {
            font-size: 36px;
            color: #3498db;
            margin: 15px 0;
            font-weight: bold;
        }

        #restart-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 180px;
            min-height: 52px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #restart-btn:active {
            transform: scale(0.95);
        }

        #wave-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #wave-indicator.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-header">
        <div class="stat">
            <div class="stat-label">LIVES</div>
            <div class="stat-value" id="lives-value">20</div>
        </div>
        <div class="stat">
            <div class="stat-label">GOLD</div>
            <div class="stat-value" id="gold-value">100</div>
        </div>
        <div class="stat">
            <div class="stat-label">WAVE</div>
            <div class="stat-value" id="wave-value">1</div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="wave-indicator"></div>
        <div id="tower-menu">
            <button class="tower-btn" data-tower="basic">
                <div>🗼</div>
                <div class="tower-cost">$50</div>
            </button>
            <button class="tower-btn" data-tower="fast">
                <div>⚡</div>
                <div class="tower-cost">$75</div>
            </button>
            <button class="tower-btn" data-tower="heavy">
                <div>💥</div>
                <div class="tower-cost">$100</div>
            </button>
        </div>
    </div>

    <div id="game-over">
        <h2>Game Over!</h2>
        <div id="final-wave">Wave 0</div>
        <p style="font-size: 16px; color: #666; margin-bottom: 10px;">Waves Survived</p>
        <button id="restart-btn">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const livesValue = document.getElementById('lives-value');
        const goldValue = document.getElementById('gold-value');
        const waveValue = document.getElementById('wave-value');
        const gameOverScreen = document.getElementById('game-over');
        const finalWaveDisplay = document.getElementById('final-wave');
        const restartBtn = document.getElementById('restart-btn');
        const towerButtons = document.querySelectorAll('.tower-btn');
        const waveIndicator = document.getElementById('wave-indicator');

        let canvasWidth, canvasHeight;
        let lives, gold, wave, gameActive;
        let selectedTowerType = null;
        let towers = [];
        let enemies = [];
        let projectiles = [];
        let path = [];
        let enemySpawnTimer = 0;
        let enemiesInWave = 0;
        let enemiesSpawned = 0;
        let waveDelay = 0;

        const towerTypes = {
            basic: { cost: 50, range: 100, damage: 10, fireRate: 60, color: '#3498db', size: 20 },
            fast: { cost: 75, range: 80, damage: 5, fireRate: 20, color: '#f39c12', size: 18 },
            heavy: { cost: 100, range: 120, damage: 25, fireRate: 90, color: '#e74c3c', size: 24 }
        };

        function resizeCanvas() {
            canvasWidth = canvas.offsetWidth;
            canvasHeight = canvas.offsetHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            generatePath();
        }

        function generatePath() {
            path = [];
            const segments = 6;
            const segmentHeight = canvasHeight / segments;

            let x = -20;
            let y = canvasHeight * 0.2;

            path.push({ x, y });

            for (let i = 0; i < segments; i++) {
                if (i % 2 === 0) {
                    x = canvasWidth - 50;
                } else {
                    x = 50;
                }
                y += segmentHeight;
                path.push({ x: Math.min(canvasWidth + 20, Math.max(-20, x)), y });
            }

            path[path.length - 1].x = canvasWidth + 20;
        }

        function drawPath() {
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#95a5a6';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
        }

        function spawnEnemy() {
            const health = 20 + wave * 10;
            const speed = 1 + wave * 0.1;
            const reward = 10 + wave * 2;

            enemies.push({
                x: path[0].x,
                y: path[0].y,
                pathIndex: 0,
                health,
                maxHealth: health,
                speed,
                reward,
                size: 15
            });
        }

        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                if (enemy.pathIndex >= path.length - 1) {
                    enemies.splice(i, 1);
                    lives--;
                    livesValue.textContent = lives;
                    if (lives <= 0) endGame();
                    continue;
                }

                const target = path[enemy.pathIndex + 1];
                const dx = target.x - enemy.x;
                const dy = target.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < enemy.speed) {
                    enemy.pathIndex++;
                } else {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }
            }
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                ctx.fill();

                const healthPercent = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(enemy.x - enemy.size, enemy.y - enemy.size - 8, enemy.size * 2 * healthPercent, 4);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(enemy.x - enemy.size, enemy.y - enemy.size - 8, enemy.size * 2, 4);
            });
        }

        function updateTowers() {
            towers.forEach(tower => {
                tower.cooldown--;

                if (tower.cooldown <= 0) {
                    let nearestEnemy = null;
                    let nearestDist = Infinity;

                    enemies.forEach(enemy => {
                        const dx = enemy.x - tower.x;
                        const dy = enemy.y - tower.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < tower.range && dist < nearestDist) {
                            nearestEnemy = enemy;
                            nearestDist = dist;
                        }
                    });

                    if (nearestEnemy) {
                        projectiles.push({
                            x: tower.x,
                            y: tower.y,
                            targetX: nearestEnemy.x,
                            targetY: nearestEnemy.y,
                            target: nearestEnemy,
                            damage: tower.damage,
                            speed: 8,
                            color: tower.color
                        });
                        tower.cooldown = tower.fireRate;
                    }
                }
            });
        }

        function drawTowers() {
            towers.forEach(tower => {
                ctx.fillStyle = tower.color;
                ctx.fillRect(tower.x - tower.size / 2, tower.y - tower.size / 2, tower.size, tower.size);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];

                if (proj.target && enemies.includes(proj.target)) {
                    proj.targetX = proj.target.x;
                    proj.targetY = proj.target.y;
                }

                const dx = proj.targetX - proj.x;
                const dy = proj.targetY - proj.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < proj.speed) {
                    if (proj.target && enemies.includes(proj.target)) {
                        proj.target.health -= proj.damage;
                        if (proj.target.health <= 0) {
                            const idx = enemies.indexOf(proj.target);
                            if (idx !== -1) {
                                gold += enemies[idx].reward;
                                goldValue.textContent = gold;
                                enemies.splice(idx, 1);
                            }
                        }
                    }
                    projectiles.splice(i, 1);
                } else {
                    proj.x += (dx / dist) * proj.speed;
                    proj.y += (dy / dist) * proj.speed;
                }
            }
        }

        function drawProjectiles() {
            projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawPath();
            drawTowers();
            drawEnemies();
            drawProjectiles();

            updateEnemies();
            updateTowers();
            updateProjectiles();

            if (waveDelay > 0) {
                waveDelay--;
                if (waveDelay === 0) {
                    startWave();
                }
            } else if (enemiesSpawned < enemiesInWave) {
                enemySpawnTimer--;
                if (enemySpawnTimer <= 0) {
                    spawnEnemy();
                    enemiesSpawned++;
                    enemySpawnTimer = 60 - wave * 2;
                }
            } else if (enemies.length === 0 && enemiesSpawned === enemiesInWave) {
                wave++;
                waveValue.textContent = wave;
                waveDelay = 120;
                showWaveIndicator();
            }

            requestAnimationFrame(gameLoop);
        }

        function startWave() {
            enemiesInWave = 5 + wave * 3;
            enemiesSpawned = 0;
            enemySpawnTimer = 0;
        }

        function showWaveIndicator() {
            waveIndicator.textContent = `Wave ${wave}`;
            waveIndicator.classList.add('show');
            setTimeout(() => {
                waveIndicator.classList.remove('show');
            }, 2000);
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!gameActive || !selectedTowerType) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const towerSpec = towerTypes[selectedTowerType];

            if (gold < towerSpec.cost) return;

            let onPath = false;
            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i + 1];
                const dx = x - p1.x;
                const dy = y - p1.y;
                const dx2 = p2.x - p1.x;
                const dy2 = p2.y - p1.y;
                const dot = dx * dx2 + dy * dy2;
                const len = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                const t = Math.max(0, Math.min(1, dot / (len * len)));
                const closestX = p1.x + t * dx2;
                const closestY = p1.y + t * dy2;
                const dist = Math.sqrt((x - closestX) ** 2 + (y - closestY) ** 2);
                if (dist < 50) {
                    onPath = true;
                    break;
                }
            }

            if (onPath) return;

            const tooClose = towers.some(t => {
                const dist = Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2);
                return dist < 40;
            });

            if (tooClose) return;

            towers.push({
                x,
                y,
                type: selectedTowerType,
                ...towerSpec,
                cooldown: 0
            });

            gold -= towerSpec.cost;
            goldValue.textContent = gold;
        });

        towerButtons.forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const towerType = btn.dataset.tower;

                if (selectedTowerType === towerType) {
                    selectedTowerType = null;
                    btn.classList.remove('selected');
                } else {
                    towerButtons.forEach(b => b.classList.remove('selected'));
                    selectedTowerType = towerType;
                    btn.classList.add('selected');
                }
            });
        });

        function startGame() {
            lives = 20;
            gold = 100;
            wave = 1;
            gameActive = true;
            selectedTowerType = null;
            towers = [];
            enemies = [];
            projectiles = [];
            waveDelay = 60;

            livesValue.textContent = lives;
            goldValue.textContent = gold;
            waveValue.textContent = wave;
            gameOverScreen.style.display = 'none';
            towerButtons.forEach(b => b.classList.remove('selected'));

            resizeCanvas();
            gameLoop();
        }

        function endGame() {
            gameActive = false;
            finalWaveDisplay.textContent = `Wave ${wave - 1}`;
            gameOverScreen.style.display = 'block';
        }

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        window.addEventListener('resize', () => {
            if (gameActive) resizeCanvas();
        });

        startGame();
    </script>
</body>
</html>
