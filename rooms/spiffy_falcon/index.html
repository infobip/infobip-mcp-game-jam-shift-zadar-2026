<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Metro Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        #game-header {
            padding: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        #game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #2d2d44;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            z-index: 100;
        }

        #game-over h2 {
            color: #ef4444;
            font-size: 32px;
            margin-bottom: 15px;
        }

        #final-score {
            font-size: 48px;
            color: #3b82f6;
            margin: 20px 0;
            font-weight: bold;
        }

        #high-score-display {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        #restart-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 200px;
            min-height: 56px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #restart-btn:active {
            transform: scale(0.95);
        }

        .swipe-hint {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 15px;
            pointer-events: none;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game-header">
        <div class="stat">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score-value">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Coins</div>
            <div class="stat-value" id="coins-value">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Speed</div>
            <div class="stat-value" id="speed-value">1.0x</div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div class="swipe-hint" id="swipe-hint">
            Swipe ↑ Jump  ↓ Slide  ← → Switch Lanes
        </div>
    </div>

    <div id="game-over">
        <h2>Game Over!</h2>
        <div id="final-score">0</div>
        <div id="high-score-display">Best: 0</div>
        <button id="restart-btn">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreValue = document.getElementById('score-value');
        const coinsValue = document.getElementById('coins-value');
        const speedValue = document.getElementById('speed-value');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const highScoreDisplay = document.getElementById('high-score-display');
        const restartBtn = document.getElementById('restart-btn');
        const swipeHint = document.getElementById('swipe-hint');

        let canvasWidth, canvasHeight;
        let gameActive = false;
        let score = 0;
        let coins = 0;
        let speed = 8;
        let baseSpeed = 8;
        let highScore = 0;

        let player = {
            lane: 1,
            y: 0,
            targetY: 0,
            jumping: false,
            sliding: false,
            velocityY: 0,
            size: 30
        };

        let obstacles = [];
        let coinItems = [];
        let trackOffset = 0;
        let nextObstacle = 0;
        let nextCoin = 0;

        const LANE_WIDTH = 100;
        const GROUND_Y = 0.75;
        const JUMP_POWER = -18;
        const GRAVITY = 0.8;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        function resizeCanvas() {
            canvasWidth = canvas.offsetWidth;
            canvasHeight = canvas.offsetHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            player.y = canvasHeight * GROUND_Y;
            player.targetY = player.y;
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            for (let i = 0; i < 50; i++) {
                const x = (Math.sin(i * 123.456) * 10000) % canvasWidth;
                const y = (Math.cos(i * 789.123) * 10000) % canvasHeight;
                ctx.fillRect(x, y, 2, 2);
            }
        }

        function drawTracks() {
            const centerX = canvasWidth / 2;
            const groundY = canvasHeight * GROUND_Y;

            ctx.fillStyle = '#374151';
            ctx.fillRect(centerX - LANE_WIDTH * 1.8, groundY, LANE_WIDTH * 3.6, canvasHeight - groundY);

            for (let lane = 0; lane < 3; lane++) {
                const x = centerX + (lane - 1) * LANE_WIDTH;

                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(x - LANE_WIDTH / 2, groundY);
                ctx.lineTo(x - LANE_WIDTH / 2, canvasHeight);
                ctx.stroke();
            }

            const dashOffset = (trackOffset * 2) % 40;
            for (let lane = 0; lane < 3; lane++) {
                const x = centerX + (lane - 1) * LANE_WIDTH;

                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.setLineDash([20, 20]);
                ctx.lineDashOffset = -dashOffset;
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.lineTo(x, canvasHeight);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, canvasHeight * GROUND_Y, canvasWidth, 4);
        }

        function drawPlayer() {
            const centerX = canvasWidth / 2;
            const x = centerX + (player.lane - 1) * LANE_WIDTH;
            const size = player.sliding ? player.size * 0.6 : player.size;

            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(x - size / 2, player.y - size, size, size);

            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(x - size / 3, player.y - size + 5, size * 0.66, size * 0.4);

            ctx.fillStyle = '#1e40af';
            ctx.fillRect(x - size / 2, player.y - size / 3, size, size / 3);
        }

        function updatePlayer() {
            if (player.jumping) {
                player.velocityY += GRAVITY;
                player.y += player.velocityY;

                if (player.y >= player.targetY) {
                    player.y = player.targetY;
                    player.jumping = false;
                    player.velocityY = 0;
                    player.sliding = false;
                }
            }
        }

        function jump() {
            if (!player.jumping) {
                player.jumping = true;
                player.velocityY = JUMP_POWER;
            }
        }

        function slide() {
            if (!player.jumping) {
                player.sliding = true;
                setTimeout(() => {
                    player.sliding = false;
                }, 500);
            }
        }

        function changeLane(direction) {
            player.lane = Math.max(0, Math.min(2, player.lane + direction));
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() > 0.5 ? 'barrier' : 'low';

            obstacles.push({
                lane,
                y: -100,
                type,
                width: 40,
                height: type === 'barrier' ? 60 : 30,
                passed: false
            });

            nextObstacle = Math.random() * 100 + 100;
        }

        function spawnCoin() {
            const lane = Math.floor(Math.random() * 3);
            const pattern = Math.random();

            if (pattern < 0.3) {
                for (let i = 0; i < 3; i++) {
                    coinItems.push({
                        lane: i,
                        y: -100 - i * 50,
                        collected: false
                    });
                }
            } else {
                for (let i = 0; i < 5; i++) {
                    coinItems.push({
                        lane,
                        y: -100 - i * 40,
                        collected: false
                    });
                }
            }

            nextCoin = Math.random() * 150 + 200;
        }

        function updateObstacles() {
            const centerX = canvasWidth / 2;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += speed;

                const obsX = centerX + (obs.lane - 1) * LANE_WIDTH;
                const playerX = centerX + (player.lane - 1) * LANE_WIDTH;

                if (!obs.passed && obs.y > canvasHeight * GROUND_Y) {
                    if (player.lane === obs.lane) {
                        const playerBottom = player.y;
                        const playerTop = player.y - (player.sliding ? player.size * 0.6 : player.size);
                        const obsBottom = obs.y;
                        const obsTop = obs.y - obs.height;

                        if (playerBottom > obsTop && playerTop < obsBottom) {
                            if (obs.type === 'barrier' && !player.jumping) {
                                endGame();
                            } else if (obs.type === 'low' && !player.sliding && !player.jumping) {
                                endGame();
                            }
                        }
                    }
                    obs.passed = true;
                }

                if (obs.y > canvasHeight + 100) {
                    obstacles.splice(i, 1);
                }
            }

            nextObstacle--;
            if (nextObstacle <= 0) {
                spawnObstacle();
            }
        }

        function updateCoins() {
            const centerX = canvasWidth / 2;

            for (let i = coinItems.length - 1; i >= 0; i--) {
                const coin = coinItems[i];
                coin.y += speed;

                if (!coin.collected && coin.y > player.y - player.size && coin.y < player.y) {
                    if (player.lane === coin.lane) {
                        coin.collected = true;
                        coins++;
                        coinsValue.textContent = coins;
                    }
                }

                if (coin.y > canvasHeight + 100) {
                    coinItems.splice(i, 1);
                }
            }

            nextCoin--;
            if (nextCoin <= 0) {
                spawnCoin();
            }
        }

        function drawObstacles() {
            const centerX = canvasWidth / 2;

            obstacles.forEach(obs => {
                const x = centerX + (obs.lane - 1) * LANE_WIDTH;

                if (obs.type === 'barrier') {
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(x - obs.width / 2, obs.y - obs.height, obs.width, obs.height);

                    ctx.fillStyle = '#fca5a5';
                    ctx.fillRect(x - obs.width / 2 + 5, obs.y - obs.height + 5, obs.width - 10, 8);
                    ctx.fillRect(x - obs.width / 2 + 5, obs.y - obs.height + 20, obs.width - 10, 8);
                } else {
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(x - obs.width / 2, obs.y - obs.height, obs.width, obs.height);

                    ctx.fillStyle = '#fbbf24';
                    ctx.fillRect(x - obs.width / 2 + 3, obs.y - obs.height + 3, obs.width - 6, obs.height - 6);
                }
            });
        }

        function drawCoins() {
            const centerX = canvasWidth / 2;

            coinItems.forEach(coin => {
                if (coin.collected) return;

                const x = centerX + (coin.lane - 1) * LANE_WIDTH;

                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(x, coin.y, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, coin.y, 12, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#fef3c7';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', x, coin.y);
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            trackOffset += speed;
            score += 1;
            scoreValue.textContent = Math.floor(score / 10);

            speed = baseSpeed + Math.floor(score / 1000) * 0.5;
            speedValue.textContent = (speed / baseSpeed).toFixed(1) + 'x';

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawBackground();
            drawTracks();
            drawObstacles();
            drawCoins();
            drawPlayer();

            updatePlayer();
            updateObstacles();
            updateCoins();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameActive = true;
            score = 0;
            coins = 0;
            speed = baseSpeed;
            obstacles = [];
            coinItems = [];
            trackOffset = 0;
            nextObstacle = 100;
            nextCoin = 150;

            player.lane = 1;
            player.y = canvasHeight * GROUND_Y;
            player.targetY = player.y;
            player.jumping = false;
            player.sliding = false;
            player.velocityY = 0;

            scoreValue.textContent = '0';
            coinsValue.textContent = '0';
            speedValue.textContent = '1.0x';
            gameOverScreen.style.display = 'none';

            setTimeout(() => {
                swipeHint.style.animation = 'fadeInOut 3s ease-in-out';
            }, 500);

            resizeCanvas();
            gameLoop();
        }

        function endGame() {
            gameActive = false;

            const finalScore = Math.floor(score / 10);
            finalScoreDisplay.textContent = finalScore;

            if (finalScore > highScore) {
                highScore = finalScore;
            }

            highScoreDisplay.textContent = `Best: ${highScore}`;
            gameOverScreen.style.display = 'block';
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            touchStartTime = Date.now();
        });

        canvas.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (!gameActive) return;

            const touchEndX = e.clientX;
            const touchEndY = e.clientY;
            const touchDuration = Date.now() - touchStartTime;

            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            const isSwipe = touchDuration < 300 && (Math.abs(deltaX) > 50 || Math.abs(deltaY) > 50);

            if (isSwipe) {
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (deltaX > 0) {
                        changeLane(1);
                    } else {
                        changeLane(-1);
                    }
                } else {
                    if (deltaY < 0) {
                        jump();
                    } else {
                        slide();
                    }
                }
            }
        });

        restartBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        startGame();
    </script>
</body>
</html>
